<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}#tabletHome{display:block;width:100%;height:100%;height:100dvh;border:0;background:#050505}</style>
</head>
<body>
<iframe id="tabletHome" title="TRANSITION SYSTEM HOME 保存版V6" src="/TRANSITION_SYSTEM_HOME_%E4%BF%9D%E5%AD%98%E7%89%88_V6.html?tabletHome=20261105"></iframe>
<script>
(function(){
 var frame=document.getElementById("tabletHome");
 function routeTabletLogo(){
  try{
   var doc=frame.contentDocument;
   if(!doc)return;
   var top="/android_tablet_saved_top_20261105_%E3%81%93%E3%81%93%E3%81%AB%E6%88%BB%E3%82%8BV2.html?route=tablet-v2-20261105";
   doc.querySelectorAll("a.brand-logo,a.mobile-taskbar a,a.topbar a[aria-label='TOP'],a[aria-label='TOPページへ'],a[aria-label='TOPへ']").forEach(function(a){a.setAttribute("href",top);});
  }catch(e){}
 }
 frame.addEventListener("load",function(){
  routeTabletLogo();
  try{
   var doc=frame.contentDocument;
   if(doc&&doc.body&&doc.defaultView&&doc.defaultView.MutationObserver){
    new doc.defaultView.MutationObserver(routeTabletLogo).observe(doc.body,{childList:true,subtree:true});
   }
  }catch(e){}
 });
})();
</script>
</body>
