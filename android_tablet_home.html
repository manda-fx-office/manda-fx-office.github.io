<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM HOME - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:auto;background:#000}
#tabletHome{display:block;width:100%;height:100%;min-height:100vh;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletHome" title="TRANSITION SYSTEM HOME" src="TRANSITION_SYSTEM_HOME_保存版_V6.html"></iframe>
<script>
(function(){
 var frame=document.getElementById("tabletHome");
 function applyHomeFix(){
  try{
   var doc=frame.contentDocument||frame.contentWindow.document;
   if(!doc||!doc.head)return;
   var old=doc.getElementById("android-tablet-home-fix");
   if(old)old.remove();
   var style=doc.createElement("style");
   style.id="android-tablet-home-fix";
   style.textContent=[
    "/* Androidタブレット専用。保存版HOME・スマホ・PC本体は変更しない */",
    ".mobile-taskbar{height:72px!important;padding:0 18px!important;justify-content:flex-start!important;}",
    ".mobile-taskbar a{width:auto!important;max-width:100%!important;overflow:hidden!important;}",
    ".mobile-taskbar img{display:block!important;width:auto!important;height:48px!important;max-width:min(230px,65vw)!important;object-fit:contain!important;object-position:left center!important;}",
    ".topbar a img.logo{max-width:230px!important;height:auto!important;object-fit:contain!important;}",
    "html{scroll-padding-top:84px!important}"
   ].join("\n");
   doc.head.appendChild(style);
   doc.querySelectorAll(".mobile-taskbar a,.topbar a,a[aria-label='TOPページへ'],a[aria-label='TOP']").forEach(function(a){
    a.href="android_tablet_top.html";
    a.target="_top";
   });
   frame.style.height=Math.max(doc.documentElement.scrollHeight,window.innerHeight)+"px";
  }catch(e){}
 }
 frame.addEventListener("load",function(){applyHomeFix();setTimeout(applyHomeFix,300);});
})();
</script>
</body>
</html>
