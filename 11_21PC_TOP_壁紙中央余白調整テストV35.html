function inspect(frame){
 if(!frame)return;
 if(!seen.has(frame)){
  seen.add(frame);
  frame.addEventListener('load',function(){scan(frame)});
 }

function scan(frame){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  if(!doc.getElementById('pc-v10-hide-embedded-toolbar')){
   var style=doc.createElement('style');
   style.id='pc-v10-hide-embedded-toolbar';
   style.textContent='.topbar,.mobile-taskbar,.taskbar,.site-header,body>header,body>nav{display:none!important}';
   (doc.head||doc.documentElement).appendChild(style);
  }
  // Blend the black rectangle of the main logo image with the TOP wallpaper.
  // Keep the logo artwork and all navigation elements unchanged.
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var entrance=doc.querySelector('.entrance');
   if(entrance){
    Array.from(entrance.querySelectorAll('img')).forEach(function(img){
     if(img.closest('header,nav,.topbar,.taskbar,.mobile-taskbar,a,button'))return;
     var r=img.getBoundingClientRect();
     if(r.width<350||r.height<140)return;
     img.style.setProperty('mix-blend-mode','screen','important');
    });
   }
  }
  // TOP's original entrance and later-added content use separate backgrounds.
  // Harmonize only the underlying page layers; preserve buttons/cards/logo.
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var sheet=doc.getElementById('pc-v23-unified-wallpaper');
   if(!sheet){
    sheet=doc.createElement('style');sheet.id='pc-v23-unified-wallpaper';
    sheet.textContent='html,body,body>.entrance,body>#community-preview,body>section#community-preview{background-color:#000!important;background-image:none!important}';
    (doc.head||doc.documentElement).appendChild(sheet);
   }
   doc.documentElement.style.setProperty('background','#000','important');
   if(doc.body){doc.body.style.setProperty('background','#000','important');doc.body.style.setProperty('background-image','none','important');}
   var en=doc.querySelector('.entrance');if(en){en.style.setProperty('background','#000','important');en.style.setProperty('background-image','none','important');}
   var cm=doc.getElementById('community-preview');if(cm){cm.style.setProperty('background','#000','important');cm.style.setProperty('background-image','none','important');}
  }
  // Remove only the horizontal divider at the COMMUNITY section boundary.
  // Preserve the about-card border and the community posting-window border.
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var community=doc.getElementById('community-preview');
   if(community){
    community.style.setProperty('border-top','0','important');
    community.style.setProperty('box-shadow','none','important');
    var st=doc.getElementById('pc-v24-no-community-divider');
    if(!st){
     st=doc.createElement('style');st.id='pc-v24-no-community-divider';
     st.textContent='#community-preview{border-top:0!important;box-shadow:none!important}#community-preview::before{border-top:0!important;box-shadow:none!important}';
     (doc.head||doc.documentElement).appendChild(st);
    }
   }
  }
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var url=wallpaperMode?wallpapers[wallpaperMode-1]:'';
   var wallpaperOn=wallpaperMode!==0;
   var html=doc.documentElement;
   var body=doc.body;
   html.classList.toggle('pc-wallpaper-on',wallpaperOn);

   html.style.setProperty('background-size',wallpaperOn?'cover':'auto','important');
   html.style.setProperty('background-position','center top','important');
   html.style.setProperty('background-attachment','fixed','important');
   html.style.setProperty('background-repeat','no-repeat','important');
   if(body){
    body.style.setProperty('background-color',wallpaperOn?'transparent':'#000','important');
    body.style.setProperty('background-image','none','important');
   }
   var en=doc.querySelector('.entrance');
   if(en){en.style.setProperty('background-color',wallpaperOn?'transparent':'#000','important');en.style.setProperty('background-image','none','important');}
   var cm=doc.getElementById('community-preview');
   if(cm){cm.style.setProperty('background-color',wallpaperOn?'transparent':'#000','important');cm.style.setProperty('background-image','none','important');}
  }
  Array.from(doc.querySelectorAll('iframe')).forEach(inspect);
 }catch(e){}
