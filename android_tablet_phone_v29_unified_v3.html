<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#phoneBase{display:block;width:100%;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;border:0;background:#000;visibility:hidden}
#bootMessage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#aaa;font:14px sans-serif;z-index:20}
body.ready #phoneBase{visibility:visible}
body.ready #bootMessage{display:none}
</style>
</head>
<body>
<div id="bootMessage" role="status">TRANSITION SYSTEM を起動しています…</div>
<iframe id="phoneBase" title="Androidスマホ正式保存版V29のタブレット表示"
 src="./index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?tabletbase=20261103v3"
 scrolling="yes"></iframe>
<script>
(function(){
  "use strict";
  var frame=document.getElementById("phoneBase");
  function applyTabletLayout(){
    try{
      var doc=frame.contentDocument||frame.contentWindow.document;
      if(!doc||!doc.head||!doc.body)return;
      var old=doc.getElementById("android-tablet-unified-v3");
      if(old)old.remove();
      var style=doc.createElement("style");
      style.id="android-tablet-unified-v3";
      style.textContent=[
        "/* Tablet display only. The saved Android smartphone V29 source remains unchanged. */",
        "html,body{height:auto!important;min-height:100%!important;margin:0!important;overflow-x:hidden!important;overflow-y:auto!important;}",
        ".site-header{height:100px!important;min-height:100px!important;padding:0 22px!important;box-sizing:border-box!important;overflow:hidden!important;}",
        ".site-header-logo{display:block!important;width:min(34vw,300px)!important;max-width:300px!important;min-width:0!important;height:auto!important;margin:0!important;}",
        ".entrance{display:block!important;position:relative!important;height:calc(100vh - 100px)!important;height:calc(100dvh - 100px)!important;min-height:calc(100vh - 100px)!important;min-height:calc(100dvh - 100px)!important;max-height:none!important;overflow:hidden!important;}",
        ".entrance:after{display:none!important;}",
        ".entrance img.hero-logo{position:absolute!important;left:50%!important;right:auto!important;top:17%!important;bottom:auto!important;transform:translateX(-50%)!important;width:min(55vw,560px)!important;max-width:560px!important;height:auto!important;object-fit:contain!important;z-index:2!important;}",
        ".entrance .bgm-btn{position:absolute!important;left:22px!important;right:auto!important;top:14px!important;z-index:10!important;padding:9px 14px!important;font-size:13px!important;}",
        ".entrance .presentation-ticker{position:absolute!important;left:50%!important;top:60%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important;width:min(82vw,850px)!important;height:58px!important;min-height:58px!important;margin:0!important;box-sizing:border-box!important;z-index:4!important;}",
        ".entrance .presentation-message{font-size:21px!important;line-height:1.15!important;padding:8px 25px!important;letter-spacing:1.3px!important;}",
        ".entrance .presentation-message span{margin-right:35px!important;}",
        ".entrance .entry-buttons{position:absolute!important;left:50%!important;top:auto!important;bottom:7%!important;right:auto!important;transform:translateX(-50%)!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;width:min(82vw,850px)!important;max-width:850px!important;z-index:5!important;}",
        ".entrance .entry-buttons .entry-btn{display:block!important;width:auto!important;min-width:0!important;padding:14px 10px!important;box-sizing:border-box!important;}",
        ".entrance .entry-buttons .entry-btn b{font-size:19px!important;letter-spacing:1.5px!important;}",
        ".entrance .entry-buttons .entry-btn span{font-size:11px!important;}",
        ".smartphone-top-controls{display:none!important;}",
        ".site-purpose,.community-preview{height:auto!important;overflow:visible!important;}",
        "@media (orientation:landscape){.entrance img.hero-logo{top:10%!important;width:min(44vw,470px)!important;}.entrance .presentation-ticker{top:57%!important;}.entrance .entry-buttons{bottom:6%!important;gap:10px!important;}.entrance .entry-buttons .entry-btn{padding:10px 9px!important;}}"
      ].join("\n");
      doc.head.appendChild(style);
      var buttons=doc.querySelectorAll(".entrance .entry-buttons a.entry-btn");
      if(buttons.length===4){
        // Tablet HOME must always open the saved HOME V6 through the tablet wrapper.
        buttons[0].href="android_tablet_navigation_test_V8.html?page="+encodeURIComponent("TRANSITION_SYSTEM_HOME_保存版_V6.html");
        buttons[0].setAttribute("target","_top");
        buttons[0].setAttribute("aria-label","保存版HOMEへ");
        buttons[1].href="project.html";
        buttons[1].removeAttribute("target");
        buttons[1].innerHTML="<b>伝助のインジケーター</b><span>伝助のインジケーター</span>";
        buttons[1].setAttribute("aria-label","伝助のインジケーター");
      }
      // Reveal only after the tablet overrides have been installed.
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          document.body.classList.add("ready");
        });
      });
    }catch(e){
      document.documentElement.setAttribute("data-tablet-layout-error","true");
      var msg=document.getElementById("bootMessage");
      if(msg)msg.textContent="画面の準備に失敗しました。再読み込みしてください。";
    }
  }
  frame.addEventListener("load",applyTabletLayout);
})();
</script>
</body>
</html>
