<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet V29 Final Layout Test</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#000;overflow-x:hidden;overflow-y:auto}
#v29{display:block;width:100%;height:100vh;min-height:100vh;border:0;background:#000;visibility:visible}
</style>
</head>
<body>
<iframe id="v29" title="TRANSITION SYSTEM V29" src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_v29_no_flash_no_blank_20261030"></iframe>
<script>
(function(){
 var frame=document.getElementById('v29');
 frame.addEventListener('load',function(){
  try{
   var doc=frame.contentDocument;
   if(!doc||!doc.head||!doc.body)return;
   var style=doc.createElement('style');
   style.id='tablet-v29-final-flow';
   style.textContent=[
    '/* Tablet-only test. Preserve V29 content and both button groups. */',
    'html,body{height:auto!important;min-height:0!important;overflow-x:hidden!important;overflow-y:visible!important;}',
    '.site-header{height:110px!important;padding:0 24px!important;}',
    '.site-header-logo{width:min(230px,30vw)!important;height:auto!important;}',
    '.entrance{position:relative!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;width:100%!important;height:auto!important;min-height:0!important;overflow:visible!important;padding:72px 24px 42px!important;box-sizing:border-box!important;gap:0!important;}',
    '.entrance:after{display:none!important;content:none!important;}',
    '.entrance img.hero-logo{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;display:block!important;width:min(62vw,500px)!important;max-width:500px!important;height:auto!important;margin:8px auto 30px!important;z-index:2!important;}',
    '.entrance .bgm-btn{position:absolute!important;top:18px!important;left:24px!important;right:auto!important;bottom:auto!important;z-index:5!important;}',
    '.entrance .music-credit{position:relative!important;margin:0 auto 18px!important;}',
    '.entrance .presentation-ticker{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;width:min(850px,calc(100% - 24px))!important;max-width:850px!important;height:auto!important;min-height:72px!important;margin:18px auto 36px!important;box-sizing:border-box!important;}',
    '.entrance .entry-buttons{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;width:min(850px,calc(100% - 24px))!important;margin:0 auto 12px!important;z-index:3!important;}',
    '.entrance .entry-buttons .entry-btn{display:block!important;position:relative!important;min-width:0!important;width:auto!important;box-sizing:border-box!important;padding:16px 12px!important;text-align:center!important;}',
    '.entrance .entry-buttons .entry-btn b{display:block!important;font-size:clamp(17px,2.1vw,23px)!important;letter-spacing:1.5px!important;}',
    '.entrance .entry-buttons .entry-btn span{display:block!important;font-size:13px!important;}',
    '.site-purpose{display:block!important;position:relative!important;height:auto!important;overflow:visible!important;}',
    '.community-preview{display:block!important;position:relative!important;height:auto!important;overflow:visible!important;}',
    '.community-preview-inner{max-width:1100px!important;margin:0 auto!important;}',
    '.smartphone-top-controls{display:grid!important;position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;width:min(760px,calc(100% - 36px))!important;margin:24px auto 20px!important;}',
    '.smartphone-top-controls .entry-btn{display:block!important;position:relative!important;min-width:0!important;width:auto!important;box-sizing:border-box!important;padding:16px 12px!important;text-align:center!important;}',
    '.smartphone-top-controls .entry-btn b{display:block!important;font-size:clamp(17px,2.1vw,23px)!important;letter-spacing:1px!important;}',
    '.smartphone-top-controls .entry-btn span{display:block!important;font-size:13px!important;}',
    /* Match the saved reference: two white QR cards, paired, compact and legible. */
    '.qr-access.qr-desktop{display:block!important;width:min(760px,calc(100% - 36px))!important;max-width:760px!important;margin:28px auto 22px!important;padding:22px 18px 26px!important;background:linear-gradient(145deg,#171a1d,#090a0b)!important;}',
    '.qr-access.qr-desktop .qr-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:18px!important;width:min(560px,100%)!important;max-width:560px!important;margin:0 auto!important;}',
    '.qr-access.qr-desktop .qr-card{display:block!important;width:auto!important;max-width:none!important;min-width:0!important;padding:12px 12px 14px!important;margin:0!important;background:#f7f7f7!important;color:#111!important;border-radius:10px!important;box-sizing:border-box!important;}',
    '.qr-access.qr-desktop .qr-card img{display:block!important;width:100%!important;max-width:220px!important;height:auto!important;margin:0 auto 10px!important;}',
    '.qr-access.qr-desktop .qr-label{font-size:16px!important;letter-spacing:2px!important;color:#111!important;}',
    '.qr-access.qr-desktop .qr-sub{font-size:11px!important;color:#555!important;}',
    '.bgm-credit{position:relative!important;margin:14px auto 24px!important;}',
    'img{max-width:100%;}'
   ].join('\n');
   doc.head.appendChild(style);
   var upper=doc.querySelectorAll('.entrance .entry-buttons a');
   if(upper.length>=2){
    upper[1].href='project.html';
    upper[1].innerHTML='<b>伝助のインジケーター</b><span>伝助のインジケーター</span>';
    upper[1].setAttribute('aria-label','伝助のインジケーター');
   }
   // QR reference screen: reveal existing PC URL/copy and TOP-return elements
   // when present in the saved source; do not create replacement links or QR images.
   function revealExistingByText(needle){
    var all=doc.body.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
     var el=all[i];
     if(el.children.length===0 && (el.textContent||'').replace(/\\s+/g,' ').trim().indexOf(needle)!==-1){
      var node=el;
      for(var depth=0;node&&depth<7;depth++,node=node.parentElement){
       node.style.setProperty('display','block','important');
       node.style.setProperty('visibility','visible','important');
       node.style.setProperty('opacity','1','important');
       if(node.classList && (node.classList.contains('qr-access') || node.classList.contains('qr-desktop')))break;
      }
     }
    }
   }
   revealExistingByText('PC版アクセスURL');
   revealExistingByText('URLをコピー');
   revealExistingByText('TOPページに戻る');
   function revealAndSize(){
    doc.documentElement.style.setProperty('height','auto','important');
    doc.body.style.setProperty('height','auto','important');
    doc.documentElement.style.setProperty('min-height','0','important');
    doc.body.style.setProperty('min-height','0','important');
    var h=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
    if(h>0){
     frame.style.height=(Math.ceil(h)+2)+'px';
     frame.style.visibility='visible';
    }
   }
   requestAnimationFrame(function(){requestAnimationFrame(revealAndSize);});
   setTimeout(revealAndSize,350);
   setTimeout(revealAndSize,1200);
   Array.prototype.forEach.call(doc.images,function(img){
    if(!img.complete)img.addEventListener('load',revealAndSize,{once:true});
   });
  }catch(e){
   // Never leave the tablet with a blank page if enhancement fails.
   frame.style.visibility='visible';
   frame.style.height='100vh';
  }
 });
})();
</script>
</body>
</html>
