<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet V29 Layout Test</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#000;overflow-x:hidden;overflow-y:auto}
#v29{display:block;width:100%;height:100vh;min-height:100vh;border:0;background:#000}
</style>
</head>
<body>
<iframe id="v29" title="TRANSITION SYSTEM V29" src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_v29_both_button_groups_20261030"></iframe>
<script>
(function(){
 var frame=document.getElementById('v29');
 frame.addEventListener('load',function(){
  try{
   var doc=frame.contentDocument;
   if(!doc||!doc.head||!doc.body)return;
   var entrance=doc.querySelector('.entrance');
   var upper=doc.querySelector('.entry-buttons');
   var lower=doc.querySelector('.smartphone-top-controls');
   if(!entrance||!upper||!lower)return;
   // 重要：上段・下段とも元のDOM位置に残す。移動・削除・固定化はしない。
   var style=doc.createElement('style');
   style.id='tablet-v29-both-groups-natural-scroll';
   style.textContent=[
    '@media (min-width:651px){',
    'html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:visible!important;}',
    '.site-header{height:110px!important;padding:0 24px!important;}',
    '.site-header-logo{width:min(230px,30vw)!important;}',
    '.entrance{position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:auto!important;min-height:calc(100vh - 110px)!important;overflow:visible!important;box-sizing:border-box!important;}',
    '.entrance img.hero-logo{transform:none!important;max-width:min(760px,78vw)!important;}',
    '.entrance .entry-buttons{display:grid!important;position:absolute!important;left:50%!important;right:auto!important;top:auto!important;bottom:7%!important;transform:translateX(-50%)!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px 20px!important;width:min(850px,88%)!important;z-index:4!important;}',
    '.entrance .entry-buttons .entry-btn{display:block!important;position:relative!important;min-width:0!important;width:auto!important;box-sizing:border-box!important;padding:15px 18px!important;text-align:center!important;}',
    '.entrance .entry-buttons .entry-btn b{display:block!important;font-size:clamp(17px,2vw,23px)!important;letter-spacing:2px!important;}',
    '.entrance .entry-buttons .entry-btn span{display:block!important;font-size:13px!important;}',
    '.smartphone-top-controls{display:grid!important;position:static!important;top:auto!important;right:auto!important;bottom:auto!important;left:auto!important;transform:none!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;width:min(760px,calc(100% - 48px))!important;margin:24px auto 18px!important;}',
    '.smartphone-top-controls .entry-btn{display:block!important;position:relative!important;min-width:0!important;width:auto!important;box-sizing:border-box!important;padding:16px 12px!important;text-align:center!important;}',
    '.smartphone-top-controls .entry-btn b{display:block!important;font-size:clamp(17px,2vw,23px)!important;letter-spacing:1px!important;}',
    '.smartphone-top-controls .entry-btn span{display:block!important;font-size:13px!important;}',
    '.community-preview,.site-purpose{position:relative!important;display:block!important;}',
    '}'
   ].join('');
   doc.head.appendChild(style);
   function fitFrame(){
    var h=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
    if(h>0)frame.style.height=h+'px';
   }
   fitFrame();
   Array.prototype.forEach.call(doc.images,function(img){
    if(!img.complete)img.addEventListener('load',fitFrame,{once:true});
   });
   if(doc.defaultView&&doc.defaultView.ResizeObserver){
    var ro=new doc.defaultView.ResizeObserver(fitFrame);
    ro.observe(doc.body);
   }
   setTimeout(fitFrame,500);
   setTimeout(fitFrame,1500);
  }catch(e){}
 });
})();
</script>
</body>
</html>
