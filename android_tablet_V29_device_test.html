<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet V29 Test</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#000;overflow:auto}
#v29{display:block;width:100%;height:100%;border:0;background:#000}
</style>
<style id="tablet-v29-css-only">
@media (min-width:651px){
  html,body{margin:0!important;min-height:100%!important;height:auto!important;overflow-x:hidden!important;overflow-y:auto!important;background:#000!important;}
  #v29{width:100%!important;height:100vh!important;min-height:100vh!important;display:block!important;border:0!important;}
  .entrance{position:relative!important;display:block!important;width:100%!important;height:100vh!important;min-height:100vh!important;overflow:hidden!important;padding:0!important;box-sizing:border-box!important;background:#000!important;}
  .entrance:after{display:none!important;}
  .entrance img.hero-logo{position:absolute!important;display:block!important;top:12vh!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important;width:min(54vw,440px)!important;height:auto!important;max-width:440px!important;object-fit:contain!important;z-index:3!important;}
  .entrance .bgm-btn{position:absolute!important;top:18px!important;right:24px!important;left:auto!important;z-index:8!important;}
  .entrance .presentation-ticker{position:absolute!important;top:72vh!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important;width:min(850px,calc(100% - 40px))!important;height:64px!important;min-height:64px!important;margin:0!important;z-index:4!important;box-sizing:border-box!important;}
  .entrance .entry-buttons{display:none!important;}
  .community-preview{position:static!important;display:block!important;padding:70px 18px 80px!important;margin:0!important;background:#050505!important;}
  .community-preview-inner{max-width:1100px!important;margin:0 auto!important;}
  .community-preview-inner .smartphone-top-controls{position:absolute!important;display:grid!important;top:47vh!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important;width:min(760px,calc(100% - 40px))!important;margin:0!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;z-index:7!important;}
  .smartphone-top-controls .entry-btn{display:block!important;min-width:0!important;width:auto!important;box-sizing:border-box!important;padding:14px 8px!important;text-align:center!important;border-radius:10px!important;}
  .smartphone-top-controls .entry-btn b{display:block!important;font-size:clamp(15px,2vw,20px)!important;letter-spacing:1px!important;}
  .smartphone-top-controls .entry-btn span{display:block!important;font-size:11px!important;}
  .community-preview-title,.community-window,.community-more{display:block!important;}
  .site-purpose{display:block!important;}
}
</style>
</head>
