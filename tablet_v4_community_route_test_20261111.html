<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRANSITION SYSTEM V4 COMMUNITY 導線テスト</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000}iframe{display:block;border:0;width:100%;height:100%}</style></head>
<body><iframe id="screen" title="TRANSITION SYSTEM V4" src="android_tablet_saved_top_20261105_%E3%81%93%E3%81%93%E3%81%AB%E6%88%BB%E3%82%8BV2.html"></iframe>
<script>
(function(){
const f=document.getElementById('screen');
const topPage='android_tablet_saved_top_20261105_%E3%81%93%E3%81%93%E3%81%AB%E6%88%BB%E3%82%8BV2.html';
const community='community_tablet_80percent_test_20261111.html';
function onClick(e){
 const a=e.target&&e.target.closest&&e.target.closest('a,button,[role="button"]');
 if(!a)return;
 const label=(a.innerText||a.textContent||'')+' '+(a.getAttribute('aria-label')||'');
 const href=a.getAttribute('href')||'';
 if(/コミュニティ|community/i.test(label)||/community(?:\.html|\?)/i.test(href)){
  e.preventDefault();e.stopImmediatePropagation();f.src=community;
 }else if(/ページトップ|TOPページ|FXの入口/i.test(label)&&f.contentWindow&&f.contentWindow.location.pathname.includes('community_tablet_80percent_test_20261111')){
  e.preventDefault();e.stopImmediatePropagation();f.src=topPage;
 }
}
f.addEventListener('load',function(){try{f.contentDocument.addEventListener('click',onClick,true)}catch(e){}});
})();
</script></body></html>
