<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>TRANSITION SYSTEM</title>
<style>
:root{
  --bg:#050505;--panel:#0d0f11;--panel2:#15181b;--silver:#d9dce0;
  --muted:#9da3a8;--line:#4d5359;--accent:#bfc5ca;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% 0%,#17191c 0,#070707 38%,#000 100%);
color:#eee;font-family:Arial,"Noto Sans JP",sans-serif}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(4,4,4,.92);backdrop-filter:blur(10px);border-bottom:1px solid #292d31}
.nav{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 22px}
.brand{font-weight:800;letter-spacing:3px}.brand small{display:block;color:#8f9499;font-size:10px;letter-spacing:2px;margin-top:3px}
.navlinks{display:flex;gap:8px}.navlinks a{padding:9px 13px;border:1px solid transparent;color:#bfc3c7;font-size:13px}
.navlinks a:hover{border-color:#555;background:#151719}
.container{max-width:1180px;margin:auto;padding:60px 22px}
.hero{min-height:620px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.15),rgba(0,0,0,.7));}
.hero-content{position:relative;z-index:1;max-width:850px}
.kicker{font-size:12px;letter-spacing:5px;color:#aab0b5}
h1{font-size:clamp(42px,7vw,82px);letter-spacing:7px;margin:18px 0 4px}
.hero p{color:#b7bcc1;font-size:18px;line-height:1.8}
.cta{display:inline-block;margin:22px 7px 0;padding:14px 32px;border:1px solid #777;background:linear-gradient(#3b4045,#0d0e10);border-radius:7px;letter-spacing:2px;box-shadow:inset 0 0 15px #ffffff12,0 0 20px #000}
.cta:hover{border-color:#ddd;transform:translateY(-1px)}
.section-title{text-align:center;margin-bottom:36px}.section-title h2{font-size:30px;letter-spacing:4px;margin:0}.section-title p{color:#8f959a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:linear-gradient(145deg,#171a1d,#090a0b);border:1px solid #34383c;border-radius:10px;padding:25px;min-height:180px;box-shadow:0 10px 30px #0008}
.card h3{letter-spacing:2px;margin-top:0}.card p{color:#aeb3b7;line-height:1.7;font-size:14px}
footer{border-top:1px solid #24272a;text-align:center;color:#70767b;padding:35px 20px;font-size:12px}
.login-wrap{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:35px 20px}
.login-box{width:min(440px,100%);padding:38px;background:linear-gradient(145deg,#181b1e,#080909);border:1px solid #555;border-radius:12px;box-shadow:0 20px 60px #000}
.login-box h1{font-size:30px;text-align:center;letter-spacing:4px}
.field{width:100%;padding:14px;margin:7px 0;background:#050606;border:1px solid #454a4e;border-radius:6px;color:#fff}
.login-btn{width:100%;padding:14px;margin-top:13px;background:linear-gradient(#4b5156,#17191b);border:1px solid #999;border-radius:7px;color:white;cursor:pointer}
.note{font-size:12px;color:#777;text-align:center;margin-top:18px;line-height:1.6}
.member-hero{padding:55px 0 30px}.member-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.status{display:inline-block;border:1px solid #5e656b;padding:7px 12px;border-radius:20px;font-size:12px;color:#c7cbd0}
@media(max-width:800px){.navlinks{display:none}.grid,.member-grid{grid-template-columns:1fr}.hero{min-height:560px}h1{letter-spacing:3px}.container{padding-top:45px}}

body{background:#000}
.entrance{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:#000}
.entrance img{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center}
.entrance:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.35))}
.entry-buttons{position:absolute;z-index:2;bottom:7%;display:flex;gap:20px;width:min(850px,88%)}
.entry-btn{flex:1;padding:20px 18px;text-align:center;border:1px solid #777;border-radius:9px;background:linear-gradient(180deg,#383d42,#08090a);box-shadow:inset 0 0 18px #fff1,0 0 24px #000;color:white}
.entry-btn:hover{border-color:#ddd;transform:translateY(-2px)}
.bgm-btn{position:absolute;right:24px;top:24px;z-index:4;padding:9px 14px;border:1px solid #666;border-radius:20px;background:rgba(8,9,10,.78);color:#ddd;font-size:12px;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(6px)}
.bgm-btn:hover{border-color:#bbb;color:#fff}
.bgm-btn.on{border-color:#aaa;color:#fff;background:rgba(35,37,40,.9)}
.music-credit{position:absolute;z-index:3;left:50%;bottom:2.5%;transform:translateX(-50%);font-size:10px;letter-spacing:.3px;color:#8f9499;text-align:center;white-space:nowrap}.music-credit a{color:#aeb3b7;text-decoration:none}.music-credit a:hover{text-decoration:underline;color:#ddd}
@media(max-width:650px){.music-credit{font-size:8px;bottom:2%;max-width:92%;white-space:normal}}
@media(max-width:650px){.bgm-btn{right:12px;top:12px;padding:8px 11px;font-size:11px}}
.entry-btn b{display:block;font-size:25px;letter-spacing:4px}.entry-btn span{font-size:12px;color:#bbb}
@media(max-width:650px){.entry-buttons{gap:10px}.entry-btn{padding:15px 8px}.entry-btn b{font-size:18px;letter-spacing:2px}}

/* === TOP COMMUNITY preview window === */
.community-preview{background:#050505;padding:70px 18px 80px;border-top:1px solid #25282b;}
.community-preview-inner{max-width:1100px;margin:0 auto;}
.community-preview-title{text-align:center;margin-bottom:24px;}
.community-kicker{font-size:11px;letter-spacing:4px;color:#8f969c;margin-bottom:8px;}
.community-preview-title h2{margin:0;font-size:34px;letter-spacing:5px;color:#e4e7e9;}
.community-preview-title p{margin:8px 0 0;color:#9ea5aa;font-size:14px;}
.community-window{height:460px;overflow:hidden;border:1px solid #555d63;border-radius:10px;background:#080909;box-shadow:0 16px 45px #0009;}
.community-window iframe{display:block;width:100%;height:100%;border:0;background:#050505;}
.community-more{text-align:center;margin-top:22px;}
.community-more-btn{display:inline-flex;align-items:center;justify-content:center;min-width:190px;padding:13px 24px;border:1px solid #8b9298;border-radius:8px;background:linear-gradient(180deg,#4a5056,#171a1d);color:#fff;font-weight:700;letter-spacing:1px;}
.community-more-btn:hover{border-color:#ddd;transform:translateY(-1px);}
@media(max-width:650px){
  .community-preview{padding:48px 10px 60px;}
  .community-preview-title h2{font-size:28px;letter-spacing:4px;}
  .community-window{height:500px;border-radius:8px;}
  .community-more-btn{min-width:170px;padding:12px 20px;}
}
</style></head><body>
<div class="entrance"><img src="cover.png" alt="TRANSITION SYSTEM">
<button class="bgm-btn" id="bgmBtn" type="button">♪ BGM OFF</button>
<audio id="bgm" src="transition_bgm.mp3" loop preload="auto" autoplay></audio>
<div class="music-credit">BGM：フリーBGM・音楽素材 MusMus「柔らかな嘘」</div>
<div class="entry-buttons">
<a class="entry-btn" href="home.html"><b>HOME</b><span>ホームページへ</span></a>
<a class="entry-btn" href="#community-preview"><b>COMMUNITY</b><span>コミュニティーを見る</span></a>
</div></div>

<section class="community-preview" id="community-preview">
  <div class="community-preview-inner">
    <div class="community-preview-title">
      <div class="community-kicker">TRANSITION SYSTEM</div>
      <h2>COMMUNITY</h2>
      <p>コミュニティー・憩いの場</p>
    </div>
    <div class="community-window">
      <iframe src="community.html" title="TRANSITION SYSTEM COMMUNITY" loading="lazy"></iframe>
    </div>
    <div class="community-more"><a href="community.html" class="community-more-btn">もっと見る　›</a></div>
  </div>
</section>
<script>
const bgm=document.getElementById('bgm');
bgm.volume=0.28;
const btn=document.getElementById('bgmBtn');
function setBgm(on){
  if(on){
    bgm.play().then(()=>{
      btn.textContent='♪ BGM ON';
      btn.classList.add('on');
    }).catch(()=>{});
  }else{
    bgm.pause();
    btn.textContent='♪ BGM OFF';
    btn.classList.remove('on');
  }
}
btn.addEventListener('click',()=>setBgm(bgm.paused));
window.addEventListener('pointerdown',()=>{
  if(bgm.paused && btn.textContent==='♪ BGM OFF') setBgm(true);
},{once:true});
bgm.addEventListener('play',()=>{
  btn.textContent='♪ BGM ON';
  btn.classList.add('on');
});
bgm.addEventListener('pause',()=>{
  btn.textContent='♪ BGM OFF';
  btn.classList.remove('on');
});
</script></body></html>
