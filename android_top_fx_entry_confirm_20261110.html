<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>TOPページ FXの入口 修正確認</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b11}iframe{display:block;width:100%;height:100%;border:0}</style></head><body>
<iframe id="top" title="TOPページ" src="./android_tablet_saved_top_20261105_%E3%81%93%E3%81%93%E3%81%AB%E6%88%BB%E3%82%8BV2.html?fx-check=20261110" loading="eager"></iframe>
<script>
(function(){
var frame=document.getElementById('top');
function fix(){
try{
var doc=frame.contentDocument;if(!doc||!doc.body)return;
doc.querySelectorAll('a,button,[role="button"]').forEach(function(el){
var txt=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
if(!/^HOME(?:\s|$)/i.test(txt))return;
var walker=doc.createTreeWalker(el,NodeFilter.SHOW_TEXT),node;
while((node=walker.nextNode())){
if(/HOME/.test(node.nodeValue||'')){node.nodeValue=node.nodeValue.replace(/HOME/g,'FXの入口');break;}
}
});
}catch(e){}
}
frame.addEventListener('load',function(){
fix();
try{var doc=frame.contentDocument;if(!doc)return;
var observer=new MutationObserver(fix);observer.observe(doc.documentElement,{childList:true,subtree:true,characterData:true});
doc.addEventListener('click',function(ev){
var el=ev.target.closest&&ev.target.closest('a,button,[role="button"]');if(!el)return;
var label=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
var destination=null;
if(label.indexOf('伝助')>=0)destination='./伝助のインジケータ_ここに戻る_V1.html?from=fx-check';
else if(label.indexOf('FXの入口')>=0 || /^HOME(?:\\s|$)/i.test(label))destination='./android_tablet_HOME_test_20261106.html?from=fx-check';
else if(label.indexOf('証券会社')>=0)destination='./fx_companies.html?from=fx-check';
else if(label.indexOf('管理人')>=0 && /Q\\s*&?\\s*A/i.test(label))destination='./admin_qa.html?from=fx-check';
if(!destination)return;
ev.preventDefault();ev.stopImmediatePropagation();
window.location.assign(destination);
},true);
}catch(e){}
});
})();
</script></body></html>
