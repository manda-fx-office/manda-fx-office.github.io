<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC TOP 灰色帯クリック診断テストV15</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090e}
#pc-fixed-bar{position:fixed;top:0;left:0;right:0;height:72px;z-index:100000;background:#17171c;border-bottom:1px solid #41414a;box-sizing:border-box;display:flex;align-items:center;padding:0 24px}
#pc-fixed-bar .brand{display:flex;align-items:center;gap:12px;color:#eee;font:700 15px system-ui,sans-serif;user-select:none;cursor:default}
#pc-fixed-bar img{width:130px;max-height:60px;object-fit:contain}
#pc-content{position:fixed;top:72px;bottom:0;left:0;right:0;width:100%;height:calc(100% - 72px);border:0;display:block;background:#09090e}
</style></head><body>
<header id="pc-fixed-bar" aria-label="PC固定タスクバー"><div class="brand"><img src="./logo.png" alt="TRANSITION SYSTEM ロゴ"></div></header>
<iframe id="pc-content" title="PC TOPページ" src="./11_20PC_TOP_ここに戻る保存版V3.html" allow="autoplay"></iframe>
<script>
(function(){
'use strict';
var root=document.getElementById('pc-content');
var seen=new WeakSet();
function inspect(frame){
 if(!frame)return;
 if(!seen.has(frame)){
  seen.add(frame);
  frame.addEventListener('load',function(){scan(frame)});
 }
 scan(frame);
}
function scan(frame){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  if(!doc.getElementById('pc-v10-hide-embedded-toolbar')){
   var style=doc.createElement('style');
   style.id='pc-v10-hide-embedded-toolbar';
   style.textContent='.topbar,.mobile-taskbar,.taskbar,.site-header,body>header,body>nav{display:none!important}';
   (doc.head||doc.documentElement).appendChild(style);
  }
  Array.from(doc.querySelectorAll('iframe')).forEach(inspect);
 }catch(e){}
}
inspect(root);
// The saved V3 creates and navigates its own nested TOP iframe asynchronously.
// Re-scan the iframe hierarchy so its taskbar is hidden even after delayed loads.
var ticks=0;
var poll=setInterval(function(){inspect(root);if(++ticks>=120)clearInterval(poll)},250);
})();
</script><div id="bg15-panel" style="position:fixed;right:8px;top:78px;z-index:999999;background:#111;color:white;border:1px solid #bbb;border-radius:8px;padding:10px;font:12px sans-serif;max-width:320px"><div>灰色の帯をクリックして診断</div><button id="bg15-start">診断開始</button><button id="bg15-copy">結果をコピー</button><pre id="bg15-result" style="white-space:pre-wrap;max-height:180px;overflow:auto"></pre></div>
<script>
(function(){
var result=document.getElementById('bg15-result'),active=false;
function describe(el){
 var lines=[];
 for(var n=0;el&&n<7;el=el.parentElement,n++){
  var cs=el.ownerDocument.defaultView.getComputedStyle(el),r=el.getBoundingClientRect();
  lines.push(el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(typeof el.className==='string'&&el.className?'.'+el.className.trim().replace(/\s+/g,'.'):'')+' | bg='+cs.backgroundColor+' | image='+cs.backgroundImage.slice(0,140)+' | y='+Math.round(r.top)+' | h='+Math.round(r.height));
 }
 return lines.join('\n');
}
function attach(frame){
 try{
  var d=frame.contentDocument;
  if(!d||!d.body)return;
  if(!d.__bg15Attached){
   d.__bg15Attached=true;
   d.addEventListener('click',function(e){
    if(!active)return;
    e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
    result.textContent='FILE '+d.location.pathname+'\n'+describe(e.target);
    active=false;
   },true);
  }
  d.querySelectorAll('iframe').forEach(attach);
 }catch(e){}
}
document.getElementById('bg15-start').onclick=function(){active=true;result.textContent='灰色の帯を1回クリックしてください';};
document.getElementById('bg15-copy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(result.textContent);};
setInterval(function(){attach(document.getElementById('pc-content'))},500);
})();
</script>
</body></html>
