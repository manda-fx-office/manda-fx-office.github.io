<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC TOP 灰色領域詳細診断V17</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090e}
#pc-fixed-bar{position:fixed;top:0;left:0;right:0;height:72px;z-index:100000;background:#17171c;border-bottom:1px solid #41414a;box-sizing:border-box;display:flex;align-items:center;padding:0 24px}
#pc-fixed-bar .brand{display:flex;align-items:center;gap:12px;color:#eee;font:700 15px system-ui,sans-serif;user-select:none;cursor:default}
#pc-fixed-bar img{width:130px;max-height:60px;object-fit:contain}
#pc-content{position:fixed;top:72px;bottom:0;left:0;right:0;width:100%;height:calc(100% - 72px);border:0;display:block;background:#09090e}
</style></head><body>
<header id="pc-fixed-bar" aria-label="PC固定タスクバー"><div class="brand"><img src="./logo.png" alt="TRANSITION SYSTEM ロゴ"></div></header>
<iframe id="pc-content" title="PC TOPページ" src="./11_20PC_TOP_ここに戻る保存版V3.html" allow="autoplay"></iframe>
<script>
(function(){
'use strict';
var root=document.getElementById('pc-content');
var seen=new WeakSet();
function inspect(frame){
 if(!frame)return;
 if(!seen.has(frame)){
  seen.add(frame);
  frame.addEventListener('load',function(){scan(frame)});
 }
 scan(frame);
}
function scan(frame){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  if(!doc.getElementById('pc-v10-hide-embedded-toolbar')){
   var style=doc.createElement('style');
   style.id='pc-v10-hide-embedded-toolbar';
   style.textContent='.topbar,.mobile-taskbar,.taskbar,.site-header,body>header,body>nav{display:none!important}';
   (doc.head||doc.documentElement).appendChild(style);
  }
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var style=doc.getElementById('pc-v16-black-background');
   if(!style){
    style=doc.createElement('style');
    style.id='pc-v16-black-background';
    style.textContent='html,body{background:#050505!important;background-color:#050505!important;background-image:none!important}';
    (doc.head||doc.documentElement).appendChild(style);
   }
   if(doc.body){
    doc.body.style.setProperty('background','#050505','important');
    doc.body.style.setProperty('background-image','none','important');
    doc.body.style.setProperty('background-color','#050505','important');
    var cs=doc.defaultView.getComputedStyle(doc.body);
    var out=document.getElementById('pc-v16-status');
    if(out)out.textContent='TOP背景の実測: '+cs.backgroundColor+' / '+cs.backgroundImage.slice(0,85);
   }
  }
  Array.from(doc.querySelectorAll('iframe')).forEach(inspect);
 }catch(e){}
}
inspect(root);
// The saved V3 creates and navigates its own nested TOP iframe asynchronously.
// Re-scan the iframe hierarchy so its taskbar is hidden even after delayed loads.
var ticks=0;
var poll=setInterval(function(){inspect(root);if(++ticks>=1200)clearInterval(poll)},250);
})();
</script><div id="pc-v16-status" style="position:fixed;right:12px;top:80px;z-index:200000;padding:7px 10px;border:1px solid #aaa;border-radius:6px;background:#111;color:#fff;font:12px sans-serif">TOP背景の実測: 読み込み中</div><div id="pc-v17-panel" style="position:fixed;right:10px;top:115px;z-index:300000;background:#111;color:white;border:1px solid #aaa;padding:9px;font:12px sans-serif;max-width:350px"><button id="pc-v17-pick">灰色領域を診断</button><button id="pc-v17-copy">結果コピー</button><pre id="pc-v17-out" style="max-height:230px;overflow:auto;white-space:pre-wrap"></pre></div>
<script>(function(){
var out=document.getElementById('pc-v17-out'),armed=false;
function fmt(el){
var d=el.ownerDocument,v=d.defaultView,s=v.getComputedStyle(el),before=v.getComputedStyle(el,'::before'),after=v.getComputedStyle(el,'::after'),r=el.getBoundingClientRect();
return el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(typeof el.className==='string'&&el.className?'.'+el.className.trim().replace(/\s+/g,'.').slice(0,75):'')+'\nbg='+s.backgroundColor+' / '+s.backgroundImage.slice(0,120)+'\nopacity='+s.opacity+' filter='+s.filter+' backdrop='+s.backdropFilter+' mix='+s.mixBlendMode+'\n::before='+before.backgroundColor+' '+before.backgroundImage.slice(0,70)+' content='+before.content.slice(0,40)+'\n::after='+after.backgroundColor+' '+after.backgroundImage.slice(0,70)+' content='+after.content.slice(0,40)+'\nbox='+Math.round(r.width)+'x'+Math.round(r.height)+' top='+Math.round(r.top);
}
function attach(frame){
try{var d=frame.contentDocument;if(!d||!d.body)return;
if(!d.__pcV17){d.__pcV17=true;d.addEventListener('click',function(e){
if(!armed)return;e.preventDefault();e.stopImmediatePropagation();armed=false;
var lines=['FILE '+d.location.pathname];for(var el=e.target,i=0;el&&i<9;el=el.parentElement,i++)lines.push(fmt(el));out.textContent=lines.join('\n----\n');
},true)}
d.querySelectorAll('iframe').forEach(attach);
}catch(e){}
}
document.getElementById('pc-v17-pick').onclick=function(){armed=true;out.textContent='灰色の領域をクリックしてください'};
document.getElementById('pc-v17-copy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(out.textContent)};
setInterval(function(){attach(document.getElementById('pc-content'))},500);
})();</script>
</body></html>
