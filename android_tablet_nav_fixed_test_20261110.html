<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>TOP ナビゲーション修正テスト</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090d16;color:#fff;font-family:Arial,sans-serif}
#bar{position:fixed;z-index:2147483000;top:0;left:0;right:0;height:48px;display:flex;align-items:center;padding:4px 18px;background:#090d16;border-bottom:1px solid #344154}
#logo{display:flex;align-items:center;gap:8px;background:none;border:0;color:#dbe8f6;font-size:13px;font-weight:bold;cursor:pointer}
#logo img{height:36px;max-width:140px;object-fit:contain}
#page{position:absolute;top:48px;left:0;width:100%;height:calc(100% - 48px);border:0;background:#090d16}
</style></head><body><div id="bar"><button id="logo" type="button" aria-label="TOPページに戻る"><span>TRANSITION SYSTEM</span></button></div><iframe id="page" title="TRANSITION SYSTEM ページ" src="./android_tablet_saved_top_20261105_%E3%81%93%E3%81%93%E3%81%AB%E6%88%BB%E3%82%8BV2.html?nav=20261110"></iframe><script>
(function(){
'use strict';
var page=document.getElementById('page'),logo=document.getElementById('logo');
var routes={
top:'./android_tablet_saved_top_20261105_%E3%81%93%E3%81%93%E3%81%AB%E6%88%BB%E3%82%8BV2.html?nav=20261110',
home:'./android_tablet_HOME_direct_2col_test_20261111.html?nav=densuke-fixed-v3',
densuke:'./android_tablet_densuke_return_fx_test_20261111.html?nav=densuke-fixed-v3',
fx:'./fx_companies.html?nav=20261110',
qa:'./admin_qa.html?nav=20261110',
community:'./community.html?nav=20261110',
login:'./login.html?nav=20261110',
system:'./android_tablet_tradesystem_5cards_return_fx_test_20261110.html?nav=20261110'
};
function go(key){if(routes[key])page.src=routes[key];}
logo.addEventListener('click',function(){go('top');});
function pageKind(){var p='';try{p=decodeURIComponent(page.contentWindow.location.pathname)}catch(e){}return p.indexOf('android_tablet_saved_top_')>=0?'top':'other';}
function labelFor(el){return ((el.innerText||el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).replace(/\s+/g,' ').trim();}
function routeFor(el){
var label=labelFor(el).toLowerCase();
var href=(el.getAttribute('href')||'').toLowerCase();
if(pageKind()==='top' && (/^system(?:\s|$)/i.test(label)||label.includes('systemを見る')||href.includes('product_tradesystem')||href.includes('android_tablet_tradesystem')))return 'system';
if(label.includes('伝助')||href.includes('project.html')||href.includes('android_tablet_project')||href.includes('android_tablet_densuke_return_fx_test'))return 'densuke';
if(label.includes('管理人')&&label.includes('q')||href.includes('admin_qa'))return 'qa';
if(label.includes('コミュニティ')||label.includes('community')||href.includes('community.html'))return 'community';
if(label.includes('login')||label.includes('ログイン')||href.includes('login.html'))return 'login';
if(label.includes('証券会社')||href.includes('fx_companies'))return 'fx';
if(label.includes('topページ')||label.includes('topへ戻る')||label.includes('トップページ')||href==='index.html'||href==='/')return 'top';
if(href.includes('android_tablet_fx_classic_layout')||href.includes('android_tablet_home_direct_2col')||label.includes('fxの入口')||/^home(?:\s|$)/i.test(label)||href==='home.html'||href.includes('android_tablet_home'))return 'home';
return null;
}
function hideLegacyTaskbar(doc){
 if(!doc.getElementById('tablet-single-bar-style')){
  var style=doc.createElement('style');style.id='tablet-single-bar-style';
  style.textContent='header, .site-header, .topbar, .top-bar, .taskbar, .task-bar, .navbar, .nav-bar, .global-header, #site-header, #header, #topbar, #taskbar {display:none !important;}';
  (doc.head||doc.documentElement).appendChild(style);
 }
 // Fallback: remove only the small legacy logo strip at the very top.
 doc.querySelectorAll('a,button').forEach(function(el){
  var rect=el.getBoundingClientRect(),label=(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'');
  var img=el.querySelector('img');
  if(rect.top<85 && rect.height>0 && rect.height<90 && (img||/TOP|logo|ロゴ/i.test(label))){
   var parent=el.closest('header,nav,.site-header,.topbar,.taskbar')||el.parentElement;
   if(parent){var pr=parent.getBoundingClientRect();if(pr.top<90&&pr.height<115&&pr.width>doc.documentElement.clientWidth*.5)parent.style.setProperty('display','none','important');}
  }
 });
}
function enforceHomeLayout(doc){
 if(!doc||!doc.getElementById('learning-path'))return;
 if(doc.getElementById('tablet-home-2col-force'))return;
 var s=doc.createElement('style');s.id='tablet-home-2col-force';
 s.textContent='#learning-path{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}#learning-path>*{width:100%!important;min-width:0!important;max-width:none!important}';
 (doc.head||doc.documentElement).appendChild(s);
}
function fixNestedHome(doc){
 var inner=doc.getElementById('original');
 if(inner&&inner.tagName==='IFRAME'){
  var apply=function(){try{enforceHomeLayout(inner.contentDocument)}catch(e){}};
  inner.addEventListener('load',apply);apply();
 }else enforceHomeLayout(doc);
}

// Tablet-only: reuse the two original QR images and copy section from the existing HOME page.
var qrSourcePromise=null;
function qrSource(){
 if(!qrSourcePromise)qrSourcePromise=fetch('./android_tablet_HOME_test_20261106.html',{cache:'force-cache'})
  .then(function(r){if(!r.ok)throw new Error('QR source unavailable');return r.text();})
  .then(function(html){var d=new DOMParser().parseFromString(html,'text/html');return d.querySelector('section.qr-access');})
  .catch(function(){return null;});
 return qrSourcePromise;
}
function addSharedQR(doc){
 var path='';try{path=decodeURIComponent(page.contentWindow.location.pathname)}catch(e){}
 var allowed=['android_tablet_HOME_direct_2col_test_20261111','android_tablet_HOME_test_20261106','android_tablet_densuke_return_fx_test_20261111','fx_companies.html','admin_qa.html'];
 if(!allowed.some(function(p){return path.includes(p)}) && !(doc.getElementById('learning-path')||doc.querySelector('.qa-container,.qa-page')))return;
 var existing=doc.querySelector('section.qr-access');
 if(existing){
  existing.id='tablet-shared-qr';
  existing.classList.add('tablet-qr-visible');
  if(!doc.getElementById('tablet-shared-qr-visible-style')){
   var visibleStyle=doc.createElement('style');visibleStyle.id='tablet-shared-qr-visible-style';
   visibleStyle.textContent='#tablet-shared-qr{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;max-width:860px!important;margin:42px auto 35px!important;clear:both!important;transform:none!important}#tablet-shared-qr .qr-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}#tablet-shared-qr img{visibility:visible!important;opacity:1!important;max-width:100%!important;height:auto!important}';
   (doc.head||doc.documentElement).appendChild(visibleStyle);
  }
  var existingFooter=doc.querySelector('footer');
  if(existingFooter&&existingFooter.parentNode)existingFooter.parentNode.insertBefore(existing,existingFooter);else doc.body.appendChild(existing);
  return;
 }
 if(doc.getElementById('tablet-shared-qr'))return;
 qrSource().then(function(source){
  if(!source||!doc.body||!doc.defaultView||doc.getElementById('tablet-shared-qr'))return;
  var s=doc.createElement('style');s.id='tablet-shared-qr-style';
  s.textContent='#tablet-shared-qr{box-sizing:border-box;max-width:860px;margin:48px auto 32px;padding:24px 18px;border:1px solid #4e647e;border-radius:14px;background:#20252c;color:#f2f4f7;text-align:center;font-family:Arial,sans-serif}#tablet-shared-qr *{box-sizing:border-box}#tablet-shared-qr .qr-access-title{font-size:23px;font-weight:700;margin-bottom:10px}#tablet-shared-qr .qr-access-subtitle{font-size:20px;margin-bottom:8px}#tablet-shared-qr .qr-access-note{font-size:13px;margin-bottom:20px}#tablet-shared-qr .qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#tablet-shared-qr .qr-card{background:#c6d5df;color:#1c2936;border-radius:9px;padding:15px 8px}#tablet-shared-qr .qr-card img{display:block;width:100%;max-width:190px;height:auto;aspect-ratio:1;object-fit:contain;margin:0 auto 8px}#tablet-shared-qr .qr-label{font-size:16px;font-weight:700}#tablet-shared-qr .qr-sub{font-size:11px}#tablet-shared-qr .qr-pc-url{margin-top:20px}#tablet-shared-qr .qr-pc-url-title{font-size:18px;margin-bottom:10px}#tablet-shared-qr .qr-pc-url-box{overflow-wrap:anywhere;border:1px solid #7495bc;padding:13px 8px;border-radius:9px}#tablet-shared-qr .qr-copy-btn,#tablet-shared-qr .qr-top-return a{display:inline-block;margin-top:13px;padding:11px 22px;border:1px solid #9bc6ef;border-radius:9px;background:linear-gradient(#68737e,#38424d);color:white;font-size:15px;text-decoration:none;cursor:pointer}';
  (doc.head||doc.documentElement).appendChild(s);
  var section=doc.importNode(source,true);section.id='tablet-shared-qr';section.removeAttribute('aria-label');
  var back=section.querySelector('.qr-top-return a');if(back){back.href=routes.top;back.textContent='⌂ TOPページに戻る';}
  var copy=section.querySelector('.qr-copy-btn');if(copy){copy.removeAttribute('onclick');copy.addEventListener('click',function(){var u='https://manda-fx-office.github.io/';if(doc.defaultView.navigator.clipboard&&doc.defaultView.navigator.clipboard.writeText){doc.defaultView.navigator.clipboard.writeText(u).then(function(){doc.defaultView.alert('URLをコピーしました。')}).catch(function(){doc.defaultView.prompt('URLをコピーしてください',u)})}else doc.defaultView.prompt('URLをコピーしてください',u);});}
  var footer=doc.querySelector('footer');if(footer&&footer.parentNode)footer.parentNode.insertBefore(section,footer);else doc.body.appendChild(section);
 });
}
function rename(doc){
if(pageKind()!=='top')return;
doc.querySelectorAll('a,button,[role="button"]').forEach(function(el){
var label=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
if(!/^HOME(?:\s|$)/i.test(label))return;
var walker=doc.createTreeWalker(el,NodeFilter.SHOW_TEXT),n;
while((n=walker.nextNode())){if(/HOME/.test(n.nodeValue||'')){n.nodeValue=n.nodeValue.replace(/HOME/g,'FXの入口');break;}}
});
}
page.addEventListener('load',function(){
try{
var doc=page.contentDocument;if(!doc)return;
hideLegacyTaskbar(doc);
rename(doc);
fixNestedHome(doc);
addSharedQR(doc);
var nested=doc.getElementById('original');if(nested&&nested.tagName==='IFRAME'){var addInnerQR=function(){try{addSharedQR(nested.contentDocument)}catch(e){}};nested.addEventListener('load',addInnerQR);addInnerQR();}
if(decodeURIComponent(page.contentWindow.location.pathname).includes('android_tablet_densuke_return_fx_test_20261111.html')){
 doc.querySelectorAll('.mobile-home-return a').forEach(function(a){
  if(/HOMEに戻る|HOMEへ戻る|FXの入口に戻る/.test(a.textContent||'')){
   a.textContent='⌂ FXの入口に戻る';
   a.setAttribute('href',routes.home);
   a.addEventListener('click',function(e){
    e.preventDefault();e.stopImmediatePropagation();go('home');
   },true);
  }
 });
}
if(pageKind()==='top'){
var imgs=Array.from(doc.images).filter(function(im){return /logo|transition/i.test(im.alt+' '+im.src)&&im.getBoundingClientRect().width<300;});
if(imgs.length){logo.innerHTML='';var im=doc.createElement('img');im.src=imgs[0].src;im.alt='TRANSITION SYSTEM';logo.appendChild(im);}
}
var observer=new MutationObserver(function(){rename(doc);});observer.observe(doc.documentElement,{childList:true,subtree:true});
doc.addEventListener('click',function(ev){
var el=ev.target.closest&&ev.target.closest('a,button,[role="button"]');if(!el)return;
var raw=el.getAttribute('href')||'';
if(/^(mailto:|tel:)/i.test(raw))return;
if(/^https?:\/\//i.test(raw) && !/manda-fx-office|transition-tablet/i.test(raw))return;
var key=routeFor(el);if(!key)return;
ev.preventDefault();ev.stopImmediatePropagation();go(key);
},true);
}catch(e){ }
});
})();
</script></body></html>
