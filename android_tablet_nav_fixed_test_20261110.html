function hideLegacyTaskbar(doc){

   fxPalette.textContent='#tablet-shared-qr{background:linear-gradient(145deg,#171a1d,#090a0b)!important;border:1px solid #34383c!important;color:#fff!important;box-shadow:0 10px 30px #0008!important}#tablet-shared-qr .qr-card{background:#f7f7f7!important;color:#111!important;border:0!important;box-shadow:0 5px 18px #0006!important}#tablet-shared-qr .qr-access-note{color:#9aa0a5!important}#tablet-shared-qr .qr-sub{color:#555!important}#tablet-shared-qr .qr-pc-url-box{background:#050505!important;border:2px solid #697078!important;color:#fff!important}#tablet-shared-qr .qr-copy-btn,#tablet-shared-qr .qr-top-return a{background:linear-gradient(#4a5156,#171a1d)!important;border:1px solid #899098!important;color:#fff!important;box-shadow:none!important}';
   (doc.head||doc.documentElement).appendChild(fxPalette);
  }
  var existingFooter=doc.querySelector('footer');
  if(existingFooter&&existingFooter.parentNode)existingFooter.parentNode.insertBefore(existing,existingFooter);else doc.body.appendChild(existing);
  return;
 }
 if(doc.getElementById('tablet-shared-qr'))return;
 qrSource().then(function(source){
  if(!source||!doc.body||!doc.defaultView||doc.getElementById('tablet-shared-qr'))return;
  var s=doc.createElement('style');s.id='tablet-shared-qr-style';
  s.textContent='#tablet-shared-qr{box-sizing:border-box;max-width:860px;margin:48px auto 32px;padding:24px 18px;border:1px solid #4e647e;border-radius:14px;background:#20252c;color:#f2f4f7;text-align:center;font-family:Arial,sans-serif}#tablet-shared-qr *{box-sizing:border-box}#tablet-shared-qr .qr-access-title{font-size:23px;font-weight:700;margin-bottom:10px}#tablet-shared-qr .qr-access-subtitle{font-size:20px;margin-bottom:8px}#tablet-shared-qr .qr-access-note{font-size:13px;margin-bottom:20px}#tablet-shared-qr .qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#tablet-shared-qr .qr-card{background:#c6d5df;color:#1c2936;border-radius:9px;padding:15px 8px}#tablet-shared-qr .qr-card img{display:block;width:100%;max-width:190px;height:auto;aspect-ratio:1;object-fit:contain;margin:0 auto 8px}#tablet-shared-qr .qr-label{font-size:16px;font-weight:700}#tablet-shared-qr .qr-sub{font-size:11px}#tablet-shared-qr .qr-pc-url{margin-top:20px}#tablet-shared-qr .qr-pc-url-title{font-size:18px;margin-bottom:10px}#tablet-shared-qr .qr-pc-url-box{overflow-wrap:anywhere;border:1px solid #7495bc;padding:13px 8px;border-radius:9px}#tablet-shared-qr .qr-copy-btn,#tablet-shared-qr .qr-top-return a{display:inline-block;margin-top:13px;padding:11px 22px;border:1px solid #9bc6ef;border-radius:9px;background:linear-gradient(#68737e,#38424d);color:white;font-size:15px;text-decoration:none;cursor:pointer}';
  (doc.head||doc.documentElement).appendChild(s);
  // Exact HOME saved-page QR palette, scoped to the two injected sections.
  if(/android_tablet_densuke_return_fx_test_20261111|fx_companies\.html/.test(path)){
   var palette=doc.createElement('style');palette.id='tablet-qr-home-exact-palette';
   palette.textContent='#tablet-shared-qr{background:linear-gradient(145deg,#171a1d,#090a0b)!important;border:1px solid #34383c!important;box-shadow:0 10px 30px #0008!important;color:#fff!important}#tablet-shared-qr .qr-card{background:#f7f7f7!important;color:#111!important;border:0!important;box-shadow:0 5px 18px #0006!important}#tablet-shared-qr .qr-access-note{color:#9aa0a5!important}#tablet-shared-qr .qr-sub{color:#555!important}#tablet-shared-qr .qr-pc-url-box{background:#050505!important;border:2px solid #697078!important;color:#fff!important}#tablet-shared-qr .qr-copy-btn,#tablet-shared-qr .qr-top-return a{background:linear-gradient(#4a5156,#171a1d)!important;border:1px solid #899098!important;color:#fff!important;box-shadow:none!important}';
   (doc.head||doc.documentElement).appendChild(palette);

 });

// COMMUNITY: constrain the actual post-card viewport, not the outer page.
function sizeCommunityExamples(doc){
 var pathname='';try{pathname=decodeURIComponent(page.contentWindow.location.pathname)}catch(e){}
 if(!pathname.endsWith('/community.html'))return;
 var gallery=doc.querySelector('.gallery');if(!gallery)return;
 // V6 gallery height increased by 20%, only in the tablet test wrapper.
 var height='calc((100dvh - 115px) * 0.78078)';
 if(!doc.getElementById('tablet-community-gallery-v7-style')){
  var style=doc.createElement('style');style.id='tablet-community-gallery-v7-style';
  style.textContent='html body .gallery,body .card .gallery{height:'+height+'!important;max-height:'+height+'!important;min-height:0!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;}#tablet-community-gallery-nav{display:flex;justify-content:center;gap:16px;margin:14px auto 18px;clear:both}#tablet-community-gallery-nav button{min-width:120px;padding:12px 22px;background:#35475a;color:#fff;border:1px solid #91aec9;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}';
  (doc.head||doc.documentElement).appendChild(style);
 }
 gallery.style.setProperty('height',height,'important');
 gallery.style.setProperty('max-height',height,'important');
 gallery.style.setProperty('min-height','0','important');
 gallery.style.setProperty('overflow-y','auto','important');
 gallery.setAttribute('data-tablet-community-post-window','v7-120-percent');
 if(doc.getElementById('tablet-community-gallery-nav'))return;
 var nav=doc.createElement('div');nav.id='tablet-community-gallery-nav';
 var prev=doc.createElement('button'),next=doc.createElement('button');
 prev.type='button';prev.textContent='戻る';next.type='button';next.textContent='次へ';
 function cards(){return Array.from(gallery.querySelectorAll(':scope > article, :scope > .post-card, :scope > .feed-card, :scope > .community-card'));}
 function move(delta){
  var list=cards();if(!list.length){gallery.scrollBy({top:delta*gallery.clientHeight,behavior:'smooth'});return;}
  var top=gallery.scrollTop;var index=0,dist=Infinity;
  list.forEach(function(card,i){var d=Math.abs(card.offsetTop-list[0].offsetTop-top);if(d<dist){dist=d;index=i;}});
  var target=Math.max(0,Math.min(list.length-1,index+delta));
  gallery.scrollTo({top:list[target].offsetTop-list[0].offsetTop,behavior:'smooth'});
 }
 prev.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();move(-1);});
 next.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();move(1);});
 nav.appendChild(prev);nav.appendChild(next);gallery.insertAdjacentElement('afterend',nav);
 // The original invitation is div.freebox inside the same section.card.
 // Move that exact existing element outside the post section; do not clone its content.
 var postSection=gallery.closest('section.card')||gallery.closest('section');
 if(postSection){
  var invitation=postSection.querySelector(':scope > .freebox');
  if(invitation && !doc.getElementById('tablet-community-invitation-panel')){
   var separate=doc.createElement('section');
   separate.id='tablet-community-invitation-panel';
   separate.className='card';
   separate.style.cssText='margin:16px auto 20px;box-sizing:border-box;';
   postSection.insertAdjacentElement('afterend',separate);
   separate.appendChild(invitation);
  }
 }
}
function rename(doc){
if(pageKind()!=='top')return;
doc.querySelectorAll('a,button,[role="button"]').forEach(function(el){
var label=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
if(!/^HOME(?:\s|$)/i.test(label))return;
var walker=doc.createTreeWalker(el,NodeFilter.SHOW_TEXT),n;
while((n=walker.nextNode())){if(/HOME/.test(n.nodeValue||'')){n.nodeValue=n.nodeValue.replace(/HOME/g,'FXの入口');break;}}
});
}
page.addEventListener('load',function(){
try{
var doc=page.contentDocument;if(!doc)return;
hideLegacyTaskbar(doc);
rename(doc);
fixNestedHome(doc);
addSharedQR(doc);
sizeCommunityExamples(doc);
if(decodeURIComponent(page.contentWindow.location.pathname).endsWith('/login.html') && !doc.getElementById('tablet-login-home-return')){
 var loginWrap=doc.querySelector('.login-wrap');
 if(loginWrap){
  loginWrap.querySelectorAll('a.back').forEach(function(a){if(/HOME.*戻る/.test(a.textContent||''))a.remove();});
  var areaLogin=doc.createElement('div');areaLogin.id='tablet-login-home-return';
  areaLogin.style.cssText='display:flex;justify-content:center;clear:both;padding:16px 14px 24px;margin:0 auto;position:relative;z-index:2';
  var loginBack=doc.createElement('a');loginBack.href=routes.home;loginBack.textContent='⌂ FXの入口に戻る';
  loginBack.style.cssText='display:inline-block;min-width:250px;padding:15px 26px;text-align:center;border:1px solid #9bc6ef;border-radius:9px;background:linear-gradient(#68737e,#38424d);color:#fff;font-size:17px;font-weight:bold;text-decoration:none';
  loginBack.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();go('home');},true);
  areaLogin.appendChild(loginBack);
  loginWrap.insertAdjacentElement('afterend',areaLogin);
  // The original login layout vertically centers the window in a full-height
  // container. Put the return control immediately under the window instead.
  var layoutStyle=doc.createElement('style');layoutStyle.id='tablet-login-layout-fix';
  layoutStyle.textContent='.login-wrap{min-height:0!important;height:auto!important;display:flex!important;align-items:center!important;justify-content:center!important;padding-top:clamp(110px,17vh,185px)!important;padding-bottom:0!important;margin-bottom:0!important}#tablet-login-home-return{margin-top:0!important}';
  (doc.head||doc.documentElement).appendChild(layoutStyle);
 }
}
if(decodeURIComponent(page.contentWindow.location.pathname).endsWith('/board.html') && !doc.getElementById('tablet-board-home-return')){
 var footerBoard=doc.querySelector('footer');
 var area=doc.createElement('div');area.id='tablet-board-home-return';area.style.cssText='display:flex;justify-content:center;padding:28px 14px 36px;clear:both';
 var btn=doc.createElement('a');btn.href=routes.home;btn.textContent='⌂ FXの入口に戻る';btn.style.cssText='display:inline-block;min-width:250px;padding:15px 26px;text-align:center;border:1px solid #9bc6ef;border-radius:9px;background:linear-gradient(#68737e,#38424d);color:#fff;font-size:17px;font-weight:bold;text-decoration:none';
 btn.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();go('home');},true);
 area.appendChild(btn);
 if(footerBoard&&footerBoard.parentNode)footerBoard.parentNode.insertBefore(area,footerBoard);else doc.body.appendChild(area);
}
var nested=doc.getElementById('original');if(nested&&nested.tagName==='IFRAME'){var addInnerQR=function(){try{addSharedQR(nested.contentDocument)}catch(e){}};nested.addEventListener('load',addInnerQR);addInnerQR();}
if(decodeURIComponent(page.contentWindow.location.pathname).includes('android_tablet_densuke_return_fx_test_20261111.html')){
 doc.querySelectorAll('.mobile-home-return a').forEach(function(a){
  if(/HOMEに戻る|HOMEへ戻る|FXの入口に戻る/.test(a.textContent||'')){
   a.textContent='⌂ FXの入口に戻る';
   a.setAttribute('href',routes.home);
   a.addEventListener('click',function(e){
    e.preventDefault();e.stopImmediatePropagation();go('home');
   },true);
  }
 });
}
if(pageKind()==='top'){
var imgs=Array.from(doc.images).filter(function(im){return /logo|transition/i.test(im.alt+' '+im.src)&&im.getBoundingClientRect().width<300;});
if(imgs.length){logo.innerHTML='';var im=doc.createElement('img');im.src=imgs[0].src;im.alt='TRANSITION SYSTEM';logo.appendChild(im);}
}
var observer=new MutationObserver(function(){rename(doc);if(page.contentWindow.location.pathname.endsWith('/community.html')&&!doc.querySelector('[data-tablet-community-post-window]'))sizeCommunityExamples(doc);});observer.observe(doc.documentElement,{childList:true,subtree:true});
doc.addEventListener('click',function(ev){
var el=ev.target.closest&&ev.target.closest('a,button,[role="button"]');if(!el)return;
var raw=el.getAttribute('href')||'';
if(/^(mailto:|tel:)/i.test(raw))return;
if(/^https?:\/\//i.test(raw) && !/manda-fx-office|transition-tablet/i.test(raw))return;
var key=routeFor(el);if(!key)return;
ev.preventDefault();ev.stopImmediatePropagation();go(key);
},true);
}catch(e){ }
});
})();
