<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM - Tablet Saved TOP Check</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#savedTop{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="savedTop" title="TRANSITION SYSTEM タブレット保存版確認"
 src="./android_tablet_saved_top.html?checkbase=20261103saved_v1"></iframe>
<script>
(function(){
  "use strict";
  var frame=document.getElementById("savedTop");
  frame.addEventListener("load",function(){
    try{
      var doc=frame.contentDocument||frame.contentWindow.document;
      if(!doc)return;
      var buttons=doc.querySelector(".entry-buttons");
      if(!buttons || buttons.querySelector(".densuke-saved-check"))return;
      var home=Array.prototype.slice.call(buttons.querySelectorAll("a.entry-btn")).find(function(a){
        return /HOME/.test((a.textContent||"").trim()) || /android_tablet_home\.html/.test(a.getAttribute("href")||"");
      });
      if(!home)return;
      var link=doc.createElement("a");
      link.className="entry-btn densuke-saved-check";
      link.href="project.html";
      link.innerHTML="<b>伝助のインジケーター</b><span>伝助のインジケーター</span>";
      buttons.insertBefore(link,home);
    }catch(e){
      document.documentElement.setAttribute("data-preview-error","true");
    }
  });
})();
</script>
</body>
</html>
