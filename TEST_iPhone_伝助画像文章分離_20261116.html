<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone 伝助窓80％テスト</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}#project{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="project" src="/11_15main起動V1/伝助のインジケータ_ここに戻る_V1.html"></iframe><script>(function(){var f=document.getElementById('project');f.addEventListener('load',function(){try{var d=f.contentDocument;if(!d)return;var st=d.createElement('style');st.id='iphone-densuke-80pct-test';st.textContent='html,body{overflow-y:auto!important;overflow-x:hidden!important;height:auto!important;min-height:100%!important;-webkit-overflow-scrolling:touch!important} .indicator-window:not([hidden]){height:80dvh!important;min-height:480px!important;max-height:none!important;overflow:hidden!important;display:block!important} .indicator-window[hidden]{display:none!important} .indicator-window:not([hidden])>.indicator-page{height:100%!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important;overscroll-behavior:contain!important}';d.head.appendChild(st);var css=d.createElement('style');css.id='iphone-densuke-separated-panes';css.textContent='.indicator-window:not([hidden])>.indicator-page{padding:12px!important;overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important}.indicator-page .densuke-content-panes{display:grid!important;grid-template-rows:minmax(145px,38%) minmax(150px,1fr)!important;gap:12px!important;height:calc(80dvh - 150px)!important;min-height:360px!important;margin:12px 0!important}.densuke-image-pane{display:flex!important;align-items:center!important;justify-content:center!important;overflow-y:auto!important;min-height:0!important;border:1px solid #64717b!important;border-radius:12px!important;background:#0b1016!important;padding:12px!important}.densuke-image-pane img{max-width:100%!important;max-height:100%!important;object-fit:contain!important}.densuke-image-placeholder{color:#aeb9c3;font-size:16px;text-align:center}.densuke-text-pane{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important;overscroll-behavior:contain!important;border:1px solid #64717b!important;border-radius:12px!important;background:#101418!important;padding:16px!important;min-height:0!important}.densuke-text-pane>*{max-width:100%!important}.indicator-page>.card,.indicator-page>.scroll-test-cards{margin-bottom:12px!important}.indicator-page-nav{position:relative!important;z-index:2!important}';d.head.appendChild(css);d.querySelectorAll('.indicator-page').forEach(function(p){var cards=Array.from(p.querySelectorAll(':scope>article.card,:scope>.scroll-test-cards>article.card'));cards.forEach(function(card){if(card.querySelector('.densuke-content-panes'))return;var wrap=d.createElement('div');wrap.className='densuke-content-panes';var imgPane=d.createElement('div');imgPane.className='densuke-image-pane';imgPane.setAttribute('aria-label','画像表示窓');var textPane=d.createElement('div');textPane.className='densuke-text-pane';textPane.setAttribute('aria-label','文章スクロール窓');var imgs=Array.from(card.querySelectorAll('img'));imgs.forEach(function(img){imgPane.appendChild(img)});if(!imgs.length){var placeholder=d.createElement('div');placeholder.className='densuke-image-placeholder';placeholder.textContent='画像表示窓（画像未登録）';imgPane.appendChild(placeholder)}while(card.firstChild)textPane.appendChild(card.firstChild);wrap.append(imgPane,textPane);card.appendChild(wrap)})});}catch(e){console.error('iPhone Densuke test',e)}})})();</script></body></html>
