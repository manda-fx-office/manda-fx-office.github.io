<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000;visibility:hidden}
#tabletTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index_TOP_スマホ正式保存版_V29.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");

  function applyTabletLinks() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.body) return;

      // 保存済みスマホ版V29の表示・ボタン・CSSは上書きしない。
      // タブレット専用にHOMEリンク先だけ変更する。
      var home = doc.querySelector(".entry-buttons a.entry-btn[href^='home_']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.target = "_top";
      }

      // 表示設定を追加する前の旧式画面が見えないよう、リンク設定後に表示する。
      frame.classList.add("ready");
    } catch (e) {
      // 読み込み失敗時は旧式画面を表示せず、隠したままにする。
    }
  }

  frame.addEventListener("load", applyTabletLinks);
})();
</script>
</body>
</html>
