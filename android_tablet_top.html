<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000;visibility:hidden}
#tabletTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index_TOP_スマホ保存版_8時35分基準_4ボタン優先_テロップさらに上.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");

  function applyTabletSettings() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head || !doc.body) return;

      var old = doc.getElementById("android-tablet-menu-fix");
      if (old) old.remove();

      var style = doc.createElement("style");
      style.id = "android-tablet-menu-fix";
      style.textContent = [
        ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;bottom:18%!important;width:calc(100% - 36px)!important;gap:10px!important;}",
        ".entry-buttons .pc-only-entry-community{display:none!important;}",
        ".entry-buttons .mobile-only-entry-densuke{display:flex!important;}",
        ".entry-buttons .entry-btn{min-width:0!important;padding:11px 7px!important;}",
        ".entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1.5px!important;}",
        ".entry-buttons .entry-btn span{font-size:10px!important;}",
        ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}"
      ].join("\n");
      doc.head.appendChild(style);

      var home = doc.querySelector(".entry-buttons a.entry-btn[href*='home']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.target = "_top";
      }

      doc.querySelectorAll(".mobile-taskbar a, .topbar a, .site-header a, a[aria-label='TOPページへ'], a[aria-label='TOP'], a[aria-label='TOPへ']").forEach(function (a) {
        var img = a.querySelector("img");
        var label = (a.getAttribute("aria-label") || "").toLowerCase();
        var logoClass = /logo/i.test(a.className || "") || !!(img && /logo/i.test(img.className || ""));
        var isLogo = !!img || logoClass || label.indexOf("top") === 0;
        if (!isLogo) return;
        a.removeAttribute("href");
        a.removeAttribute("target");
        a.setAttribute("aria-disabled", "true");
        a.style.cursor = "default";
        a.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
        }, true);
      });

      // 表示調整を適用してから画面を見せ、起動時の旧式表示を隠す。
      frame.classList.add("ready");
    } catch (e) {}
  }

  frame.addEventListener("load", applyTabletSettings);
})();
</script>
</body>
</html>
