<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000;visibility:hidden}
#tabletTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E4%BF%9D%E5%AD%98%E7%89%88_8%E6%99%8235%E5%88%86%E5%9F%BA%E6%BA%96_4%E3%83%9C%E3%82%BF%E3%83%B3%E5%84%AA%E5%85%88_%E3%83%86%E3%83%AD%E3%83%83%E3%83%97%E3%81%95%E3%82%89%E3%81%AB%E4%B8%8A.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");

  function applyTabletSettings() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head || !doc.body) return;

      var old = doc.getElementById("android-tablet-smartphone-layout");
      if (old) old.remove();

      var style = doc.createElement("style");
      style.id = "android-tablet-smartphone-layout";
      style.textContent = [
        "/* Androidタブレット専用。保存済みスマホTOP本体やPC版は変更しない */",
        ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;bottom:18%!important;}",
        ".entry-buttons .entry-btn{display:block!important;min-width:0!important;padding:12px 7px!important;}",
        ".entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1px!important;}",
        ".entry-buttons .entry-btn span{font-size:10px!important;}",
        ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}",
        ".entrance .presentation-ticker{width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;}"
      ].join("\n");
      doc.head.appendChild(style);

      // 実際のリンク文言を照合し、タブレット内だけCOMMUNITYを伝助ボタンに置き換える。
      var links = Array.prototype.slice.call(doc.querySelectorAll(".entry-buttons a"));
      var community = links.find(function (a) {
        var label = (a.innerText || a.textContent || "").replace(/\s+/g, " ").trim();
        return /^COMMUNITY(?:\s|$)/i.test(label) || /^コミュニティー(?:\s|$)/.test(label) || /^コミュニティ(?:\s|$)/.test(label);
      });
      if (community) {
        community.href = "project.html";
        community.target = "_top";
        community.removeAttribute("onclick");
        community.setAttribute("aria-label", "伝助のインジケーター");
        community.innerHTML = "<b>伝助のインジケーター</b><span>伝助のインジケーター</span>";
      }

      var home = doc.querySelector(".entry-buttons a.entry-btn[href^='home_']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.target = "_top";
        home.removeAttribute("onclick");
      }

      frame.classList.add("ready");
    } catch (e) {
      // 設定を適用できない場合は旧式画面を途中表示しない。
    }
  }

  frame.addEventListener("load", applyTabletSettings);
})();
</script>
</body>
</html>
