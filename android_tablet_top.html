<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000;visibility:hidden}
#tabletTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");

  function applyTabletSettings() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head || !doc.body) return;

      var old = doc.getElementById("android-tablet-smartphone-layout");
      if (old) old.remove();

      var style = doc.createElement("style");
      style.id = "android-tablet-smartphone-layout";
      style.textContent = [
        "/* Androidタブレット専用：保存版TOPのスマホ向け表示を適用 */",
        ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;bottom:7%!important;}",
        ".entry-buttons .pc-only-entry-community{display:none!important;}",
        ".entry-buttons .mobile-only-entry-densuke{display:flex!important;}",
        ".entry-buttons .entry-btn{min-width:0!important;padding:12px 7px!important;}",
        ".entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1px!important;}",
        ".entry-buttons .entry-btn span{font-size:10px!important;}",
        ".bgm-btn{left:24px!important;right:auto!important;top:12px!important;padding:8px 11px!important;font-size:11px!important;}",
        ".entrance .presentation-ticker{width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;}",
        ".entry-buttons .mobile-only-entry-densuke b{font-size:14px!important;letter-spacing:.5px!important;}"
      ].join("\n");
      doc.head.appendChild(style);

      // タブレット内のHOMEリンクだけ、タブレット専用HOMEへ接続する。
      var home = doc.querySelector(".entry-buttons a.entry-btn[href^='home_']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.removeAttribute("onclick");
        home.target = "_top";
      }

      frame.classList.add("ready");
    } catch (e) {
      // 設定適用前の旧式表示は出さない。
    }
  }

  frame.addEventListener("load", applyTabletSettings);
})();
</script>
</body>
</html>
