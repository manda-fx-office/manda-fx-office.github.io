<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .05s}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index_TOP_スマホ正式保存版_V29.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");

  function applyTabletFix() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head) return;

      var old = doc.getElementById("android-tablet-menu-fix");
      if (old) old.remove();

      var style = doc.createElement("style");
      style.id = "android-tablet-menu-fix";
      style.textContent = [
        "/* Androidタブレット専用。スマホ保存版・PC版のファイルは変更しない */",
        ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;bottom:18%!important;width:calc(100% - 36px)!important;gap:10px!important;}",
        ".entry-buttons .pc-only-entry-community{display:none!important;}",
        ".entry-buttons .mobile-only-entry-densuke{display:flex!important;}",
        ".entry-buttons .entry-btn{min-width:0!important;padding:11px 7px!important;}",
        ".entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1.5px!important;}",
        ".entry-buttons .entry-btn span{font-size:10px!important;}",
        ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}"
      ].join("\n");
      doc.head.appendChild(style);
      frame.style.opacity = "1";

      var home = doc.querySelector(".entry-buttons a.entry-btn[href^='home_']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.target = "_top";
      }

      var logo = doc.querySelector(".mobile-taskbar a, .topbar a, .site-header a[aria-label='TOPへ'], .site-header a, a[aria-label='TOPページへ'], a[aria-label='TOP']");
      doc.querySelectorAll(".mobile-taskbar a, .topbar a, .site-header a, a[aria-label='TOPページへ'], a[aria-label='TOP']").forEach(function (a) {
        a.href = "android_tablet_top.html";
        a.target = "_top";
      });
    } catch (e) {
      /* 調整が適用できない場合は元ページを表示する */
      frame.style.opacity = "1";
    }
  }

  frame.addEventListener("load", applyTabletFix);
})();
</script>
</body>
</html>
