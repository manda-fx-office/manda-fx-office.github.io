<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index.html?tabletfix=2"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyTabletMenu() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.body || !doc.head) return;

      // Find the old COMMUNITY tile by URL first, then by visible text.
      var links = Array.prototype.slice.call(doc.querySelectorAll("a"));
      var target = links.find(function (a) {
        return /community\.html/i.test(a.getAttribute("href") || "");
      }) || links.find(function (a) {
        var label = (a.innerText || a.textContent || "").replace(/\s+/g, " ").trim();
        return /COMMUNITY|コミュニティー|コミュニティ/i.test(label);
      });

      if (target) {
        target.href = "project.html";
        target.setAttribute("aria-label", "伝助のインジケーター");
        target.innerHTML = '<b>伝助のインジケーター</b><span>伝助のインジケーター</span>';
      }

      // Apply styling only inside this tablet wrapper; never changes index.html on disk.
      var style = doc.getElementById("android-tablet-menu-fix");
      if (!style) {
        style = doc.createElement("style");
        style.id = "android-tablet-menu-fix";
        style.textContent = [
          "a[aria-label='伝助のインジケーター']{display:block!important;visibility:visible!important;text-align:center}",
          "a[aria-label='伝助のインジケーター'] b{display:block;font-size:13px;letter-spacing:.5px}",
          "a[aria-label='伝助のインジケーター'] span{display:block;font-size:10px;color:#bbb}"
        ].join("\n");
        doc.head.appendChild(style);
      }
    } catch (e) {
      // Keep the page visible if browser security or loading prevents injection.
    }
  }
  frame.addEventListener("load", applyTabletMenu);
})();
</script>
</body>
</html>
