<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index_TOP_スマホ正式保存版_V29.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyLinks() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.body) return;

      // TOPのHOMEボタンだけをタブレット用HOMEへ接続する。
      var home = doc.querySelector(".entry-buttons a.entry-btn[href^='home_']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.target = "_top";
      }

      // TOP画面のロゴは押しても移動しない仕様。スマホ保存版本体は編集せず、
      // タブレット表示内でロゴを含むリンクだけ無効化する。
      var candidates = doc.querySelectorAll(
        ".mobile-taskbar a, .topbar a, .site-header a, a[aria-label='TOPページへ'], a[aria-label='TOP']"
      );
      candidates.forEach(function (a) {
        var label = (a.getAttribute("aria-label") || "").toLowerCase();
        var hasLogoImage = !!a.querySelector("img");
        var isTopLabel = label === "top" || label === "topページへ";
        if (!hasLogoImage && !isTopLabel) return;
        a.removeAttribute("href");
        a.removeAttribute("target");
        a.setAttribute("aria-disabled", "true");
        a.style.cursor = "default";
        a.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
        }, true);
      });
    } catch (e) {}
  }
  frame.addEventListener("load", applyLinks);
})();
</script>
</body>
</html>
