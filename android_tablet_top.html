<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyTabletMenu() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.body || !doc.head) return;
      // Androidタブレット用ページ内だけで、COMMUNITYボタンを伝助ボタンへ置換する。
      // 特定のCSSクラス名には依存せず、画面上のボタン文言から対象を探す。
      var links = Array.prototype.slice.call(doc.querySelectorAll("a"));
      var target = links.find(function (a) {
        var label = (a.innerText || a.textContent || "").replace(/\s+/g, " ").trim();
        return /^COMMUNITY(?:\s|$)/i.test(label) || /^コミュニティー(?:\s|$)/.test(label) || /^コミュニティ(?:\s|$)/.test(label);
      });
      if (target) {
        target.href = "project.html";
        target.setAttribute("aria-label", "伝助のインジケーター");
        target.innerHTML = '<b>伝助のインジケーター</b><span>伝助のインジケーター</span>';
        target.style.display = "block";
        target.style.visibility = "visible";
      }
      var style = doc.getElementById("android-tablet-menu-fix");
      if (!style) {
        style = doc.createElement("style");
        style.id = "android-tablet-menu-fix";
        style.textContent = "a[aria-label='伝助のインジケーター']{display:block!important;visibility:visible!important;text-align:center}a[aria-label='伝助のインジケーター'] b{display:block;font-size:13px;letter-spacing:.5px}a[aria-label='伝助のインジケーター'] span{display:block;font-size:10px;color:#bbb}";
        doc.head.appendChild(style);
      }
    } catch (e) {
      // 元ページの表示は維持する。
    }
  }
  frame.addEventListener("load", applyTabletMenu);
})();
</script>
</body>
</html>
