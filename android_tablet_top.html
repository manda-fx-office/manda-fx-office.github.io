<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000;visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyTabletFix() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head) return;
      var old = doc.getElementById("android-tablet-menu-fix");
      if (old) old.remove();
      var style = doc.createElement("style");
      style.id = "android-tablet-menu-fix";
      style.textContent = [
        "/* Android tablet only: use the saved smartphone TOP's four-button layout */",
        ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;bottom:18%!important;width:calc(100% - 36px)!important;gap:10px!important;}",
        ".entry-buttons .pc-only-entry-community{display:none!important;}",
        ".entry-buttons .mobile-only-entry-densuke{display:flex!important;}",
        ".entry-buttons .entry-btn{min-width:0!important;padding:11px 7px!important;}",
        ".entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1.5px!important;}",
        ".entry-buttons .entry-btn span{font-size:10px!important;}",
        ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}",
        "a.entry-btn[href^='home_']{href:'TRANSITION_SYSTEM_HOME_写真照合修正版_20261013_v2.html';}",
      ].join("\n");
      doc.head.appendChild(style);\n      frame.style.visibility = "visible";
      var home = doc.querySelector(".entry-buttons a.entry-btn[href^='home_']");
      if (home) {
        home.href = "TRANSITION_SYSTEM_HOME_写真照合修正版_20261013_v2.html";
        home.target = "_top";
      }
      var logo = doc.querySelector(".site-header a[aria-label='TOPへ'], .site-header a");
      if (logo) {
        logo.href = "android_tablet_top.html";
        logo.target = "_top";
      }
    } catch (e) {
      /* Keep the page visible if the tablet adjustment cannot be applied. */
      frame.style.visibility = "visible";
    }
  }
  frame.addEventListener("load", applyTabletFix);
})();
</script>
</body>
</html>
