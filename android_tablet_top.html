<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM - Android Tablet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM TOP" src="index_TOP_スマホ正式保存版_V29.html"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");

  function applyTabletLinksOnly() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.body) return;

      // 表示・配置・サイズのCSSは一切上書きしない。
      // HOMEリンクのみタブレット専用HOMEへ向ける。
      var home = doc.querySelector(".entry-buttons a.entry-btn[href*='home']");
      if (home) {
        home.href = "android_tablet_home.html";
        home.target = "_top";
      }

      // TOPロゴはクリックしても移動しない。
      doc.querySelectorAll(".mobile-taskbar a, .topbar a, .site-header a, a[aria-label='TOPページへ'], a[aria-label='TOP'], a[aria-label='TOPへ']").forEach(function (a) {
        var img = a.querySelector("img");
        var label = (a.getAttribute("aria-label") || "").toLowerCase();
        var logoClass = /logo/i.test(a.className || "") || !!(img && /logo/i.test(img.className || ""));
        var isLogo = !!img || logoClass || label.indexOf("top") === 0;
        if (!isLogo) return;
        a.removeAttribute("href");
        a.removeAttribute("target");
        a.setAttribute("aria-disabled", "true");
        a.style.cursor = "default";
        a.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
        }, true);
      });
    } catch (e) {}
  }

  frame.addEventListener("load", applyTabletLinksOnly);
})();
</script>
</body>
</html>
