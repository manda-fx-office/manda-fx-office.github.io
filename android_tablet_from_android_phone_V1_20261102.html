<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM Android Tablet - Phone V29 Adaptation V1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#phoneBase{display:block;width:100%;height:100%;border:0;background:#000}
#savedAt{position:fixed;z-index:99999;top:5px;right:10px;padding:3px 7px;border:1px solid rgba(180,210,230,.45);border-radius:5px;background:rgba(0,0,0,.72);color:#c9d9e5;font:10px/1.3 Arial,sans-serif;pointer-events:none}
</style>
</head>
<body>
<div id="savedAt">タブレット変換版 V1 / 2026-11-02 20:10 JST</div>
<iframe id="phoneBase" title="Androidスマホ正式保存版V29を原本にしたタブレット表示"
 src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_phone_base_20261102_v1"></iframe>
<script>
(function(){
 var frame=document.getElementById("phoneBase");
 function apply(){
  try{
   var doc=frame.contentDocument||frame.contentWindow.document;
   if(!doc||!doc.head||!doc.body)return;
   var previous=doc.getElementById("android-tablet-phone-adaptation-v1");
   if(previous)previous.remove();
   var style=doc.createElement("style");
   style.id="android-tablet-phone-adaptation-v1";
   style.textContent=[
    "/* Androidスマホ正式保存版V29を原本として読み込み、タブレット表示だけ変換 */",
    "html,body{width:100%;min-height:100%;}",
    ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}",
    ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;bottom:18%!important;}",
    ".entry-buttons .entry-btn{display:block!important;min-width:0!important;padding:12px 7px!important;box-sizing:border-box!important;}",
    ".entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1px!important;}",
    ".entry-buttons .entry-btn span{font-size:10px!important;}",
    ".entry-buttons .pc-only-entry-community{display:none!important;}",
    ".entry-buttons .mobile-only-entry-densuke{display:flex!important;}",
    ".entrance .presentation-ticker{width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;}"
   ].join(String.fromCharCode(10));
   doc.head.appendChild(style);
   var densuke=doc.querySelector(".entry-buttons .mobile-only-entry-densuke");
   if(densuke){densuke.style.display="flex";densuke.setAttribute("aria-label","伝助のインジケーター");}
   var community=doc.querySelector(".entry-buttons .pc-only-entry-community");
   if(community)community.style.display="none";
   var links=Array.prototype.slice.call(doc.querySelectorAll(".entry-buttons a,.entry-buttons button"));
   links.forEach(function(el){
    var label=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim();
    if(/^COMMUNITY\b/i.test(label)||/^コミュニティ/.test(label)){
     el.href="project.html";el.target="_top";
     el.innerHTML="<b>伝助のインジケーター</b><span>伝助のインジケーター</span>";
     el.setAttribute("aria-label","伝助のインジケーター");
    }
   });
  }catch(e){}
 }
 frame.addEventListener("load",apply);
})();
</script>
</body>
</html>
