<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM Android Tablet Navigation Test</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#tabletTop{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM Android Tablet V29" allow="autoplay; fullscreen"></iframe>
<script>
(function(){
 var f=document.getElementById("tabletTop");
 function adjust(){
  try{
   var d=f.contentDocument||f.contentWindow.document;
   if(!d||!d.head||!d.body)return;
   var s=d.getElementById("tablet-navigation-test-style");
   if(!s){s=d.createElement("style");s.id="tablet-navigation-test-style";d.head.appendChild(s);}
   s.textContent=[
    "/* Isolated tablet test: keep V29 page content; replace legacy entry buttons with V29 smartphone navigation. */",
    ".entry-buttons{display:none!important;}",
    ".community-preview{display:block!important;position:static!important;min-height:0!important;height:0!important;margin:0!important;padding:0!important;border:0!important;overflow:visible!important;background:transparent!important;}",
    ".community-preview-inner{display:block!important;position:static!important;width:100%!important;margin:0!important;padding:0!important;}",
    ".community-preview-title,.community-window,.community-more{display:none!important;}",
    ".smartphone-top-controls{display:grid!important;visibility:visible!important;opacity:1!important;position:fixed!important;left:50%!important;right:auto!important;top:auto!important;bottom:9%!important;transform:translateX(-50%)!important;width:calc(100% - 48px)!important;max-width:760px!important;height:auto!important;margin:0!important;padding:0!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;z-index:99999!important;}",
    ".smartphone-top-controls .entry-btn{display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;min-width:0!important;width:auto!important;min-height:62px!important;margin:0!important;padding:10px 6px!important;box-sizing:border-box!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;}",
    ".smartphone-top-controls .entry-btn b{display:block!important;font-size:clamp(15px,2.2vw,22px)!important;line-height:1.2!important;letter-spacing:.5px!important;}",
    ".smartphone-top-controls .entry-btn span{display:block!important;font-size:12px!important;line-height:1.2!important;margin-top:4px!important;}",
    ".smartphone-top-controls .entry-btn:nth-child(2) b{font-size:clamp(12px,1.8vw,18px)!important;letter-spacing:0!important;}",
    ".site-purpose,.qr-access,.music-credit{display:none!important;}"
   ].join("\n");
  }catch(e){}
 }
 f.addEventListener("load",adjust);
 f.src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_navigation_test_20261029j";
})();
</script>
</body>
</html>
