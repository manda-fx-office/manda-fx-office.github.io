<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FXの入口 | 学ぶ順番</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0a0f1a;color:#e8edf5;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:960px;margin:auto;padding:24px 18px 64px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#8ba6ce}h1{font-size:clamp(24px,5vw,38px);margin:12px 0}p{line-height:1.8;color:#c3cedd}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.step{min-height:96px;background:#121d30;border:1px solid #46617f;border-radius:14px;color:#fff;padding:14px;text-align:left;font:inherit;cursor:pointer}.step strong{display:block;color:#d9e8ff;font-size:18px;margin-bottom:6px}.step span{font-size:13px;color:#b5c7dd}.step.active{border:2px solid #d7b777;background:#21324a}.window{border:1px solid #49617b;background:#101b2d;border-radius:15px;min-height:280px;max-height:58vh;overflow:auto;padding:22px;margin-top:12px;scrollbar-color:#657e9f #101b2d}.window article{display:none}.window article.active{display:block}.window h3{font-size:22px;color:#fff}.window p,.window li{line-height:1.9;color:#d1dae8}.window .num{font-size:12px;color:#dfc48c}.window ul{padding-left:24px}.window button{background:#253c57;color:white;border:1px solid #6c86a6;border-radius:9px;padding:10px}.return{display:block;margin:20px auto 0;padding:15px 24px;border:1px solid #c6a76c;background:#18273a;color:#fff;border-radius:12px;font-size:16px;cursor:pointer}.hint{font-size:13px;color:#a9bad0}@media(min-width:700px){.steps{max-width:680px}.window{max-height:62vh}}
</style></head><body><main id="page-top"><div class="eyebrow">TRANSITION SYSTEM / FX ENTRY</div><h1>FXの入口</h1><p>FXをこれから始める方へ。仕組み・チャート・時間足・資金管理・心を順番に学びましょう。</p><h2 id="learning-path">学ぶ順番</h2><div class="steps" id="steps"><button class="step active" data-n="1"><strong>① 基本</strong><span>FXの仕組みを知る</span></button><button class="step" data-n="2"><strong>② チャート</strong><span>相場の流れを見る</span></button><button class="step" data-n="3"><strong>③ 時間足</strong><span>トレードスタイルと時間足</span></button><button class="step" data-n="4"><strong>④ 資金管理</strong><span>無理のない資金管理</span></button><button class="step" data-n="5"><strong>⑤ 心</strong><span>ルールを守り冷静に判断</span></button></div><div class="hint">ボタンを選ぶと、下の窓に学習カードが表示されます。</div><section class="window" id="card-window" aria-label="学習カード表示窓"><p>保存版の学習カードを読み込んでいます…</p></section><button class="return" id="back">学ぶ順番に戻る</button></main><script>
(function(){
var windowEl=document.getElementById('card-window'),buttons=Array.from(document.querySelectorAll('.step'));var cards=[];
function show(n){buttons.forEach(function(b){b.classList.toggle('active',Number(b.dataset.n)===n);});cards.forEach(function(c,i){c.classList.toggle('active',i===n-1);});windowEl.scrollTop=0;}
buttons.forEach(function(b){b.addEventListener('click',function(){show(Number(b.dataset.n));});});
document.getElementById('back').addEventListener('click',function(){document.getElementById('page-top').scrollIntoView({behavior:'smooth',block:'start'});});
fetch('./android_tablet_HOME_test_20261106.html').then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.text();}).then(function(html){
var source=new DOMParser().parseFromString(html,'text/html');
cards=[1,2,3,4,5].map(function(n){return source.querySelector('#detail-'+n);});
if(cards.some(function(c){return !c;}))throw Error('保存カードの取得に失敗');
windowEl.innerHTML='';
cards.forEach(function(original){var card=document.importNode(original,true);card.removeAttribute('id');card.classList.add('learning-card');windowEl.appendChild(card);});
cards=Array.from(windowEl.querySelectorAll('article'));
show(1);
}).catch(function(e){windowEl.textContent='保存版カードを読み込めませんでした。'+e.message;});
})();
</script></body></html>
