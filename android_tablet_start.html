<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM 起動</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#bbb}
body{display:grid;place-items:center;font:14px sans-serif}
</style>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var screenWidth = Number(screen.width) || 0;
  var viewportWidth = Number(window.innerWidth) || 0;

  // 縦向きタブレットは短辺が600px未満として報告される場合があるため、
  // 短辺ではなく表示幅を使って判定する。
  var isTablet = isAndroid && (!isMobileUA || screenWidth >= 600 || viewportWidth >= 600);
  var target = isTablet ? "android_tablet_top.html" :
               (isAndroid ? "android_start.html" : "index.html");
  window.location.replace(target);
})();
</script>
</head>
<body>
起動しています…
</body>
</html>
