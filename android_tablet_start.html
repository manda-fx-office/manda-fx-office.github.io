<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM 起動</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#bbb}
body{display:grid;place-items:center;font:14px sans-serif}
</style>
<script>
(function () {
  // Androidタブレットアプリの新しい唯一の入口。
  // Androidスマホは従来の起動先を維持し、PC/その他も既存TOPへ進める。
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  var isTablet = isAndroid && (!isMobileUA || smallSide >= 600);
  var target = isTablet ? "android_tablet_top.html" :
               (isAndroid ? "android_start.html" : "index.html");
  window.location.replace(target);
})();
</script>
</head>
<body>
起動しています…
</body>
</html>
