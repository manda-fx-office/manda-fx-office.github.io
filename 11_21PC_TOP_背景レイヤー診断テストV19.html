<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC TOP 背景レイヤー診断V19</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090e}
#pc-fixed-bar{position:fixed;top:0;left:0;right:0;height:72px;z-index:100000;background:#17171c;border-bottom:1px solid #41414a;box-sizing:border-box;display:flex;align-items:center;padding:0 24px}
#pc-fixed-bar .brand{display:flex;align-items:center;gap:12px;color:#eee;font:700 15px system-ui,sans-serif;user-select:none;cursor:default}
#pc-fixed-bar img{width:130px;max-height:60px;object-fit:contain}
#pc-content{position:fixed;top:72px;bottom:0;left:0;right:0;width:100%;height:calc(100% - 72px);border:0;display:block;background:#09090e}
</style></head><body>
<header id="pc-fixed-bar" aria-label="PC固定タスクバー"><div class="brand"><img src="./logo.png" alt="TRANSITION SYSTEM ロゴ"></div></header>
<iframe id="pc-content" title="PC TOPページ" src="./11_20PC_TOP_ここに戻る保存版V3.html" allow="autoplay"></iframe>
<script>
(function(){
'use strict';
var root=document.getElementById('pc-content');
var seen=new WeakSet();
function inspect(frame){
 if(!frame)return;
 if(!seen.has(frame)){
  seen.add(frame);
  frame.addEventListener('load',function(){scan(frame)});
 }
 scan(frame);
}
function scan(frame){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  if(!doc.getElementById('pc-v10-hide-embedded-toolbar')){
   var style=doc.createElement('style');
   style.id='pc-v10-hide-embedded-toolbar';
   style.textContent='.topbar,.mobile-taskbar,.taskbar,.site-header,body>header,body>nav{display:none!important}';
   (doc.head||doc.documentElement).appendChild(style);
  }
  Array.from(doc.querySelectorAll('iframe')).forEach(inspect);
 }catch(e){}
}
inspect(root);
// The saved V3 creates and navigates its own nested TOP iframe asynchronously.
// Re-scan the iframe hierarchy so its taskbar is hidden even after delayed loads.
var ticks=0;
var poll=setInterval(function(){inspect(root);if(++ticks>=120)clearInterval(poll)},250);
})();
</script><aside id="v19-panel" style="position:fixed;right:12px;top:80px;width:400px;max-width:45vw;z-index:300000;background:#111;color:#fff;border:1px solid #888;padding:10px;font:12px monospace"><b>背景レイヤー診断V19</b> <button id="v19-check">再診断</button> <button id="v19-copy">コピー</button><pre id="v19-out" style="max-height:250px;overflow:auto;white-space:pre-wrap">読み込み中</pre></aside>
<script>(function(){
var out=document.getElementById('v19-out'),report='';
function short(el){if(!el)return 'none';var s=el.ownerDocument.defaultView.getComputedStyle(el);return el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(typeof el.className==='string'&&el.className?'.'+el.className.trim().replace(/\s+/g,'.').slice(0,70):'')+' bg='+s.backgroundColor+' image='+s.backgroundImage.slice(0,95)+' opacity='+s.opacity+' z='+s.zIndex}
function inspect(doc,depth){
if(!doc||!doc.body||depth>5)return;
var w=doc.documentElement.clientWidth,h=doc.documentElement.clientHeight;
report+='\nFRAME '+depth+' '+doc.location.pathname+' '+w+'x'+h;
[.08,.28,.5,.72,.92].forEach(function(yp){
var x=Math.floor(w*.12),y=Math.floor(h*yp),els=doc.elementsFromPoint(x,y);
report+='\nPOINT '+x+','+y+' '+els.slice(0,7).map(short).join(' > ');
});
Array.from(doc.querySelectorAll('iframe')).forEach(function(f){try{inspect(f.contentDocument,depth+1)}catch(e){report+='\niframe error '+e.message}});
}
function run(){report='';try{inspect(document.getElementById('pc-content').contentDocument,1)}catch(e){report=e.message}out.textContent=report}
document.getElementById('v19-check').onclick=run;document.getElementById('v19-copy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(report)};
setTimeout(run,2500);setTimeout(run,7000);
})();</script>
</body></html>
