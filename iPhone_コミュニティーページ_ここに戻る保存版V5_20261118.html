/* Test-only: put navigation OUTSIDE the entire QR window. */
(function(){

     return /qr|android|iphone|コード/i.test(im.alt||'') || (im.naturalWidth>70&&Math.abs(im.naturalWidth-im.naturalHeight)<30);
    });

   });

/* Test-only: remove the legacy HOME footer without changing the QR panel. */
(function(){

 function clean(doc){
  if(!doc||!doc.body)return;

  candidates.forEach(function(el){
   if(el.closest('#community-between-usage-qr,header,.topbar,#tablet-v4-nav'))return;

  });

 });
