/* Test-only COMMUNITY footer replacement before iframe becomes visible. */
(function(){
 var f=document.getElementById('original');
 f.style.visibility='hidden';
 function fix(){
  try{
   var d=f.contentDocument;if(!d)return;
   var nodes=Array.from(d.querySelectorAll('a,button'));
   nodes.forEach(function(old){
    if(old.closest('header,.topbar,#tablet-v4-nav'))return;
    var label=(old.textContent||'').replace(/\s+/g,'').trim();
    if(!/(?:HOME(?:ページ)?に戻る|FXの入口)/.test(label)||label.length>24)return;
    if(old.dataset.iphoneCommunityFxHome==='yes')return;
    var b=d.createElement('button');
    b.type='button';b.textContent='FXの入口';
    b.dataset.iphoneCommunityFxHome='yes';
    b.className=old.className;
    b.style.cssText='display:inline-flex!important;width:auto!important;max-width:180px!important;min-width:0!important;justify-content:center!important;align-items:center!important;padding:10px 22px!important;min-height:44px;box-sizing:border-box!important;border:1px solid #8fa4b9;border-radius:9px;background:#303c4b;color:#fff;font-size:16px;font-weight:700;cursor:pointer';
    old.replaceWith(b);
   });
   if(!d.__iphoneCommunityFxObserver){
    d.__iphoneCommunityFxObserver=new MutationObserver(fix);
    d.__iphoneCommunityFxObserver.observe(d.documentElement,{childList:true,subtree:true});
   }
  }catch(e){console.error(e)}
  f.style.visibility='visible';
 }
 f.addEventListener('load',fix);
 if(f.contentDocument&&f.contentDocument.readyState==='complete')fix();
})();
