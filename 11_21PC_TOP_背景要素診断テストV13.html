<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC TOP 背景診断テストV13</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090e}
#pc-fixed-bar{position:fixed;top:0;left:0;right:0;height:72px;z-index:100000;background:#17171c;border-bottom:1px solid #41414a;box-sizing:border-box;display:flex;align-items:center;padding:0 24px}
#pc-fixed-bar .brand{display:flex;align-items:center;gap:12px;color:#eee;font:700 15px system-ui,sans-serif;user-select:none;cursor:default}
#pc-fixed-bar img{width:130px;max-height:60px;object-fit:contain}
#pc-content{position:fixed;top:72px;bottom:0;left:0;right:0;width:100%;height:calc(100% - 72px);border:0;display:block;background:#09090e}
</style></head><body>
<header id="pc-fixed-bar" aria-label="PC固定タスクバー"><div class="brand"><img src="./logo.png" alt="TRANSITION SYSTEM ロゴ"></div></header>
<iframe id="pc-content" title="PC TOPページ" src="./11_20PC_TOP_ここに戻る保存版V3.html" allow="autoplay"></iframe>
<script>
(function(){
'use strict';
var root=document.getElementById('pc-content');
var seen=new WeakSet();
function inspect(frame){
 if(!frame)return;
 if(!seen.has(frame)){
  seen.add(frame);
  frame.addEventListener('load',function(){scan(frame)});
 }
 scan(frame);
}
function scan(frame){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  if(!doc.getElementById('pc-v10-hide-embedded-toolbar')){
   var style=doc.createElement('style');
   style.id='pc-v10-hide-embedded-toolbar';
   style.textContent='.topbar,.mobile-taskbar,.taskbar,.site-header,body>header,body>nav{display:none!important}';
   (doc.head||doc.documentElement).appendChild(style);
  }
  Array.from(doc.querySelectorAll('iframe')).forEach(inspect);
 }catch(e){}
}
inspect(root);
// The saved V3 creates and navigates its own nested TOP iframe asynchronously.
// Re-scan the iframe hierarchy so its taskbar is hidden even after delayed loads.
var ticks=0;
var poll=setInterval(function(){inspect(root);if(++ticks>=120)clearInterval(poll)},250);
})();
</script><aside id="pc-bg-diagnostic" style="position:fixed;right:12px;top:82px;width:min(440px,45vw);max-height:45vh;overflow:auto;z-index:200000;background:#101010;color:#f2f2f2;border:1px solid #aaa;border-radius:8px;padding:12px;font:12px/1.5 monospace;white-space:pre-wrap;box-shadow:0 4px 20px #0008"><b>背景診断V13（画面には変更を加えません）</b><div id="pc-bg-results">調査中…</div><button id="pc-bg-copy" style="margin-top:8px">診断結果をコピー</button><button id="pc-bg-close" style="margin-left:8px">閉じる</button></aside>
<script>
(function(){
'use strict';
var result=document.getElementById('pc-bg-results');
var report='';
function analyze(doc,depth){
 if(!doc||!doc.body||depth>4)return;
 var view=doc.defaultView,w=doc.documentElement.clientWidth||view.innerWidth;
 var nodes=Array.from(doc.querySelectorAll('html,body,body *'));
 var hits=[];
 nodes.forEach(function(el){
  if(el.tagName==='SCRIPT'||el.tagName==='STYLE')return;
  var box=el.getBoundingClientRect();
  if(box.width<w*.7||box.height<70)return;
  var cs=view.getComputedStyle(el);
  var bg=cs.backgroundColor,bi=cs.backgroundImage;
  if(bg==='rgba(0, 0, 0, 0)'&&bi==='none')return;
  var cls=typeof el.className==='string'?el.className.slice(0,65):'';
  hits.push(el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(cls?'.'+cls.trim().replace(/\\s+/g,'.'):'')+' y='+Math.round(box.top)+' h='+Math.round(box.height)+' bg='+bg+' img='+bi.slice(0,105));
 });
 report+='\n[frame '+depth+'] '+doc.location.pathname+'\n'+hits.slice(0,30).join('\n')+'\n';
 Array.from(doc.querySelectorAll('iframe')).forEach(function(f){try{analyze(f.contentDocument,depth+1)}catch(e){report+='\n[iframe access error] '+e.message}});
}
function refresh(){
 report='';try{analyze(document.getElementById('pc-content').contentDocument,1)}catch(e){report='Error: '+e.message}
 result.textContent=report||'背景要素を検出できません';
}
document.getElementById('pc-bg-copy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(report)};
document.getElementById('pc-bg-close').onclick=function(){document.getElementById('pc-bg-diagnostic').style.display='none'};
setTimeout(refresh,1500);setTimeout(refresh,4500);setTimeout(refresh,8500);
})();
</script>
</body></html>
