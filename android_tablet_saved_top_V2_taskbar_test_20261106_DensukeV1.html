<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TRANSITION SYSTEM タブレット保存版TOP テスト</title></head>
<body style="margin:0;background:#050505;color:#fff;font-family:sans-serif"><div id="loading" style="padding:24px">保存版テストアプリを読み込んでいます…</div>
<script>
(async function(){
 const parts=["tablet_testapp_top_v2_densuke_v1_part_01.txt","tablet_testapp_top_v2_densuke_v1_part_02.txt","tablet_testapp_top_v2_densuke_v1_part_03.txt","tablet_testapp_top_v2_densuke_v1_part_04.txt","tablet_testapp_top_v2_densuke_v1_part_05.txt","tablet_testapp_top_v2_densuke_v1_part_06.txt","tablet_testapp_top_v2_densuke_v1_part_07.txt","tablet_testapp_top_v2_densuke_v1_part_08.txt","tablet_testapp_top_v2_densuke_v1_part_09.txt","tablet_testapp_top_v2_densuke_v1_part_10.txt","tablet_testapp_top_v2_densuke_v1_part_11.txt","tablet_testapp_top_v2_densuke_v1_part_12.txt","tablet_testapp_top_v2_densuke_v1_part_13.txt","tablet_testapp_top_v2_densuke_v1_part_14.txt","tablet_testapp_top_v2_densuke_v1_part_15.txt","tablet_testapp_top_v2_densuke_v1_part_16.txt","tablet_testapp_top_v2_densuke_v1_part_17.txt","tablet_testapp_top_v2_densuke_v1_part_18.txt","tablet_testapp_top_v2_densuke_v1_part_19.txt"];
 try{
  const html=await Promise.all(parts.map(async function(name){
   const response=await fetch("./"+name+"?copy=20261110",{cache:"no-store"});
   if(!response.ok)throw new Error(name+" の読み込みに失敗しました（"+response.status+"）");
   return await response.text();
  }));
  document.open();document.write(html.join(""));document.close();
 }catch(error){
  document.getElementById("loading").textContent="保存版TOPの読み込みに失敗しました："+error.message;
 }
})();
</script></body></html>
