<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>11/21 TOP ロゴ・背景保存版適用テストV2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090e}
#pc-fixed-bar{position:fixed;top:0;left:0;right:0;height:72px;z-index:100000;background:#17171c;border-bottom:1px solid #41414a;box-sizing:border-box;display:flex;align-items:center;padding:0 24px}
#pc-fixed-bar .brand{display:flex;align-items:center;gap:12px;color:#eee;font:700 15px system-ui,sans-serif;user-select:none;cursor:default}
#pc-fixed-bar img{width:130px;max-height:60px;object-fit:contain}
#pc-content{position:fixed;top:72px;bottom:0;left:0;right:0;width:100%;height:calc(100% - 72px);border:0;display:block;background:#09090e}
#pc-fixed-bar{justify-content:space-between;height:80px;padding:0 18px;background:rgba(4,4,4,.95);border-bottom:1px solid #292d31}#pc-fixed-bar img{width:150px;max-height:65px}#pc-fixed-nav{display:none;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:center}#pc-fixed-nav a{min-width:92px;height:54px;padding:6px 8px;border:1px solid rgba(210,215,220,.58);border-radius:8px;background:linear-gradient(180deg,#484f56,#30363c 55%,#20252a);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 5px #0007;font-family:Arial,"Noto Sans JP",sans-serif;box-sizing:border-box}#pc-fixed-nav .nav-en{font-size:12px;font-weight:700;letter-spacing:.5px}#pc-fixed-nav .nav-ja{margin-top:3px;font-size:9px;letter-spacing:.7px}body.pc-community-active #pc-fixed-nav{display:flex}body.pc-community-active #pc-content{top:80px;height:calc(100% - 80px)}@media(max-width:1050px){#pc-fixed-nav a{min-width:76px;padding:5px 4px}#pc-fixed-nav .nav-en{font-size:10px}}
body.pc-detail-active #pc-fixed-bar{display:none!important}body.pc-detail-active #pc-content{top:0!important;height:100%!important}
</style></head><body>
<header id="pc-fixed-bar" aria-label="PC固定タスクバー"><div class="brand"><img src="./logo.png" alt="TRANSITION SYSTEM ロゴ"></div></header>
<iframe id="pc-content" title="PC TOPページ" src="./11_21V3_コミュニティーのみ導線修正版.html" allow="autoplay"></iframe>
<script>
(function(){
'use strict';
var root=document.getElementById('pc-content');
var seen=new WeakSet();
function inspect(frame){
 if(!frame)return;
 if(!seen.has(frame)){
  seen.add(frame);
  frame.addEventListener('load',function(){scan(frame)});
 }
 scan(frame);
}
function scan(frame){
 try{
  var doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  if(!doc.getElementById('pc-v10-hide-embedded-toolbar')){
   var style=doc.createElement('style');
   style.id='pc-v10-hide-embedded-toolbar';
   style.textContent=doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1 ? '.topbar,.mobile-taskbar,.taskbar,.site-header,body>header,body>nav{display:none!important}' : '';
   (doc.head||doc.documentElement).appendChild(style);
  }
  // Blend the black rectangle of the main logo image with the TOP wallpaper.
  // Keep the logo artwork and all navigation elements unchanged.
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var entrance=doc.querySelector('.entrance');
   if(entrance){
    Array.from(entrance.querySelectorAll('img')).forEach(function(img){
     if(img.closest('header,nav,.topbar,.taskbar,.mobile-taskbar,a,button'))return;
     var r=img.getBoundingClientRect();
     if(r.width<350||r.height<140)return;
     img.style.setProperty('mix-blend-mode','screen','important');
    });
   }
  }
  // TOP's original entrance and later-added content use separate backgrounds.
  // Harmonize only the underlying page layers; preserve buttons/cards/logo.
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var sheet=doc.getElementById('pc-v23-unified-wallpaper');
   if(!sheet){
    sheet=doc.createElement('style');sheet.id='pc-v23-unified-wallpaper';
    sheet.textContent='html,body,body>.entrance,body>#community-preview,body>section#community-preview{background-color:#000!important;background-image:none!important}';
    (doc.head||doc.documentElement).appendChild(sheet);
   }
   doc.documentElement.style.setProperty('background','#000','important');
   if(doc.body){doc.body.style.setProperty('background','#000','important');doc.body.style.setProperty('background-image','none','important');}
   var en=doc.querySelector('.entrance');if(en){en.style.setProperty('background','#000','important');en.style.setProperty('background-image','none','important');}
   var cm=doc.getElementById('community-preview');if(cm){cm.style.setProperty('background','#000','important');cm.style.setProperty('background-image','none','important');}
  }
  // Remove only the horizontal divider at the COMMUNITY section boundary.
  // Preserve the about-card border and the community posting-window border.
  if(doc.location.pathname.indexOf('android_tablet_saved_top_20261105_')!==-1){
   var community=doc.getElementById('community-preview');
   if(community){
    community.style.setProperty('border-top','0','important');
    community.style.setProperty('box-shadow','none','important');
    var st=doc.getElementById('pc-v24-no-community-divider');
    if(!st){
     st=doc.createElement('style');st.id='pc-v24-no-community-divider';
     st.textContent='#community-preview{border-top:0!important;box-shadow:none!important}#community-preview::before{border-top:0!important;box-shadow:none!important}';
     (doc.head||doc.documentElement).appendChild(st);
    }
   }
  }
  // COMMUNITY: the outer saved taskbar is the only visible taskbar.
  try{
   var controller=root.contentWindow;
   var active=controller && new URLSearchParams(controller.location.search).get('page')==='community';
   document.body.classList.toggle('pc-community-active',active);
   if(active && doc!==root.contentDocument){
    var loc=decodeURIComponent(doc.location.pathname);
    if(/COMMUNITY_ここに戻る|iPhone_コミュニティーページ_ここに戻る/.test(loc)){
     if(!doc.getElementById('pc-community-single-bar-v3')){
      var single=doc.createElement('style');single.id='pc-community-single-bar-v3';
      single.textContent='header.topbar,.mobile-taskbar,.topbar,body>header:not(.pc-unified-topbar),body>nav,.taskbar{display:none!important}.pc-unified-topbar{display:block!important}';
      (doc.head||doc.documentElement).appendChild(single);
     }
    }
   }
  }catch(e){}
  Array.from(doc.querySelectorAll('iframe')).forEach(inspect);
 }catch(e){}
}
function syncDetailBar(){try{var active=new URLSearchParams(root.contentWindow.location.search).get('page');document.body.classList.toggle('pc-detail-active',!!active&&active!=='top');}catch(e){}}
inspect(root);
// The saved V3 creates and navigates its own nested TOP iframe asynchronously.
// Re-scan the iframe hierarchy so its taskbar is hidden even after delayed loads.
var ticks=0;
var poll=setInterval(function(){inspect(root);syncDetailBar();if(++ticks>=480)clearInterval(poll)},250);
})();
</script></body></html>
