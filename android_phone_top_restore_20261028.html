<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM Android Phone TOP Restore</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#phoneTop{display:block;width:100%;height:100%;border:0;background:#000;visibility:hidden}
#phoneTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="phoneTop" title="TRANSITION SYSTEM Android Phone TOP" src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=20261028_v29_source"></iframe>
<script>
(function(){
 var frame=document.getElementById("phoneTop");
 frame.addEventListener("load",function(){
  try{
   var doc=frame.contentDocument||frame.contentWindow.document;
   if(!doc||!doc.head||!doc.body)return;
   var old=doc.getElementById("android-phone-restore");
   if(old)old.remove();
   var style=doc.createElement("style");
   style.id="android-phone-restore";
   style.textContent=[
    "/* Androidスマホ専用表示。保存版原本・PC版・iPhone版は変更しない */",
    "html,body{max-width:100%;overflow-x:hidden!important;}",
    ".entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;width:calc(100% - 28px)!important;left:50%!important;transform:translateX(-50%)!important;}",
    ".entry-buttons .entry-btn{min-width:0!important;padding:10px 4px!important;}",
    ".entry-buttons .entry-btn b{font-size:14px!important;}",
    ".entry-buttons .entry-btn span{font-size:9px!important;}"
   ].join("\n");
   doc.head.appendChild(style);
   var links=Array.prototype.slice.call(doc.querySelectorAll(".entry-buttons a,.entry-buttons button"));
   var community=links.find(function(el){
    var label=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim();
    return /^COMMUNITY\b/i.test(label)||/^コミュニティ/.test(label);
   });
   if(community){
    community.href="project.html";
    community.target="_top";
    community.removeAttribute("onclick");
    community.setAttribute("aria-label","伝助のインジケーター");
    community.innerHTML="<b>伝助のインジケーター</b><span>伝助のインジケーター</span>";
   }
   frame.classList.add("ready");
  }catch(e){}
 });
})();
</script>
</body>
</html>
