<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRANSITION SYSTEM TOP</title></head>
<body style="margin:0;background:#050505;color:#fff;font-family:sans-serif">
<div id="loading" style="padding:24px">保存版TOPを読み込んでいます…</div>
<script>
(async function(){
 const parts=["top_saved_v1_part_01.txt","top_saved_v1_part_02.txt","top_saved_v1_part_03.txt","top_saved_v1_part_04.txt","top_saved_v1_part_05.txt","top_saved_v1_part_06.txt","top_saved_v1_part_07.txt","top_saved_v1_part_08.txt","top_saved_v1_part_09.txt","top_saved_v1_part_10.txt","top_saved_v1_part_11.txt","top_saved_v1_part_12.txt","top_saved_v1_part_13.txt","top_saved_v1_part_14.txt","top_saved_v1_part_15.txt"];
 const html=await Promise.all(parts.map(async function(name){
   const response=await fetch("./"+name+"?restore=20261110");
   if(!response.ok) throw new Error(name+" の読み込みに失敗しました");
   return await response.text();
 }));
 document.open();document.write(html.join(""));document.close();
})().catch(function(error){
 document.getElementById("loading").textContent="TOP画面の読み込みに失敗しました："+error.message;
});
</script></body></html>
