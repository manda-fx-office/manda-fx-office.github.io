<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC TOP FXの入口 タブレット保存版移植テスト V3 | TRANSITION SYSTEM</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="pc" title="PC TOP FXの入口 タブレット保存版移植テスト V3" src="./index.html?pc_preview=20261118v2"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('pc');
const destination=new URL('./PC_TEST_FXの入口_タブレット保存版V1_20261118.html',location.href).href;
function normalize(s){return (s||'').replace(/[\s\u3000]+/g,'').toUpperCase();}
function findHome(doc){
  const candidates=Array.from(doc.querySelectorAll('a,button,[role="button"]'));
  return candidates.filter(el=>{
    if(el.dataset.pcFxPatched==='1')return false;
    const text=normalize(el.textContent);
    if(text==='HOME'||text==='HOMEホームページへ'||text==='HOMEホームへ')return true;
    return Array.from(el.querySelectorAll('*')).some(child=>normalize(child.textContent)==='HOME' && child.children.length===0);
  });
}
function patch(){
  try{
    const doc=frame.contentDocument;if(!doc||!doc.body)return;
    for(const el of findHome(doc)){
      el.dataset.pcFxPatched='1';
      const nodes=doc.createTreeWalker(el,NodeFilter.SHOW_TEXT);
      let n,done=false;
      while((n=nodes.nextNode())){
        if(normalize(n.nodeValue)==='HOME'){n.nodeValue=n.nodeValue.replace(/HOME/i,'FXの入口');done=true;break;}
      }
      if(!done){const label=el.querySelector('.nav-en,.btn-title,.title,strong,b,span')||el;label.textContent='FXの入口';}
      for(const sub of el.querySelectorAll('*')){
        if(sub.children.length===0 && /ホームページへ|ホームへ/.test(sub.textContent))sub.textContent='FXの入口へ';
      }
      if(el.tagName==='A')el.href=destination;
      el.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();window.location.assign(destination);},true);
    }
  }catch(e){console.warn('PC preview patch:',e);}
}
frame.addEventListener('load',function(){
  patch();
  try{
    const doc=frame.contentDocument;
    if(doc&&doc.body){
      let pending=false;
      new MutationObserver(function(){if(!pending){pending=true;queueMicrotask(function(){pending=false;patch();});}}).observe(doc.body,{subtree:true,childList:true});
    }
  }catch(e){}
});
})();
</script></body></html>
