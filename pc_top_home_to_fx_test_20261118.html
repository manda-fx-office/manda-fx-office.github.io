<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC TOP 修正確認 V1 | TRANSITION SYSTEM</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="pc" title="PC TOP 修正確認" src="./index.html?pc_preview=20261118v1"></iframe>
<script>
(function(){
const frame=document.getElementById('pc');
function patch(){
try{
const doc=frame.contentDocument;if(!doc||!doc.body)return;
const els=doc.querySelectorAll('a,button,[role="button"]');
for(const el of els){
if(el.closest('nav') && el.textContent.trim().toUpperCase()==='HOME' || (el.textContent.trim().toUpperCase()==='HOME' && !el.querySelector('a,button'))){
if(el.tagName==='A'){el.href='./fx.html';el.textContent='FXの入口';}
else if(el.tagName==='BUTTON'){el.textContent='FXの入口';el.onclick=function(e){e.preventDefault();window.location.href='./fx.html';};}
}
}
}catch(e){}
}
frame.addEventListener('load',function(){patch();const d=frame.contentDocument;if(d&&d.body){new MutationObserver(patch).observe(d.body,{subtree:true,childList:true});}});
})();
</script></body></html>
