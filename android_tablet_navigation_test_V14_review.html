     story.innerHTML='<div class="post-label">NEW POST · 2026/11/02</div><img src="community_honnouji_small.jpg" alt="本能寺の変＝蜘蛛の糸 戦場イメージ"><div class="post-title">誰も見たことがない、もう一つの『本能寺の変』</div><div class="comment"><p>私は映画作りのプロでも何でもない、ただのど素人です。ですが、歴史の謎が大好きで、自分なりの感性で「本当はあの時代、こうだったのではないか？」という強い思いがあり、ずっと温めてきた新解釈があります。</p><p>「もしも、本能寺の変の前に、織田信長がすでに死んでいたとしたら？」</p><p>そんなバカな、と思われるかもしれません。ですが、歴史のあらゆる点と点が一本の線で結びつく、極上のサスペンス映画のような物語を考えてみました。</p><h3>映画タイトル案：『本能寺の変＝蜘蛛の糸』</h3><h3>🎬 完全版あらすじ</h3><p><strong>【第一幕：神の堕ちた夜と「捨て駒」】</strong><br>天正十年六月一日夜、京都・妙覚寺。信長の長男・信忠は、父と激しい口論の末、突発的に信長を刺殺してしまう。パニックになる信忠の前に現れたのは、信長に瓜二つの影武者・骨平（こつへい）だった。骨平は「私が本能寺で信長公の身代わりとなり、時間を稼ぎます」と信忠を二条城へ誘導する。だが実は、骨平は羽柴秀吉が何年も前から送り込んでいた捨て駒だった。</p><p><strong>【第二幕：正義の操り人形】</strong><br>同日深夜。明智光秀のもとに『信忠が謀反！ただちに京へ入り、逆臣・信忠を討て』という密書が届く。光秀は「正義の仇討ち」のために出陣する。しかし、夜闇の混乱から、明智軍の先陣は間違えて「影武者のいる本能寺」を包囲し、火を放ってしまう。影武者・骨平は自ら炎の中で「信長」として自害。光秀は誤算に動揺しつつも、二条城の信忠を急襲し、弁明の機会も与えず討ち果たす。光秀は「主君の仇を討った」と信じていた。</p><p><strong>【第三幕：怪物の蜘蛛の糸】</strong><br>備中高松の羽柴軍本陣。京からの早馬を受け取った秀吉は、軍師・黒田官兵衛に全貌を明かす。信忠の焦燥、光秀への密書、本能寺の影武者、すべては秀吉が仕組んだ罠だった。京から一番遠くにいる自分こそが、絶対に疑われない最高のアリバイを持つ。官兵衛はその底知れぬ恐怖に震え上がり、秀吉に絶対の忠誠を誓う。秀吉は即座に毛利と和睦し、「光秀こそが主殺しの謀反人だ！」と大号泣して諸将の怒りを光秀へ向け、京へとひた走る（中国大返し）。</p><p><strong>【第四幕：偽りの歴史】</strong><br>六月十三日、山崎の戦い。秀吉の大軍の前に明智軍は崩壊。雨の戦場で秀吉と光秀は一対一で対峙する。光秀は己の正義を叫ぶが、秀吉は嘲笑いながらすべての真実を告げる。「信長は最初から死んでいた。本能寺で死んだのは俺の影武者だ。お前は俺の台本の上の大道具だった」と。自分が信じた正義も命を懸けた戦いも、すべて秀吉の道具に過ぎなかったことを知り、光秀は魂を完全に破壊され、絶望の中で絶命する。数日後の清洲会議。信長、信忠、光秀が消え去った大広間で、秀吉は幼い三法師を抱きかかえ、完全な「天下人」の目で諸将を見下ろす。歴史の勝者が、偽りの歴史を書き換えた瞬間だった。</p><hr><p>遺体が見つからなかった本能寺の変の謎に、エンタメとして最高の回答が出せる設定だと思っています。</p><p>このあらすじをベースに、セリフや心理描写をリアルに表現した「小説版（本編）」も書き上げました。次の投稿で、その【本編フルストーリー】を丸ごと公開します！</p><p>#本能寺の変 #歴史新解釈 #映画企画 #羽柴秀吉 #明智光秀 #織田信長 #サスペンス #創作小説 #シナリオプロット</p></div>';
     tabletGallery.insertBefore(story,tabletGallery.firstChild);
