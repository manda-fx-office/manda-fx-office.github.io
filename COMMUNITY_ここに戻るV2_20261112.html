<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COMMUNITY ここに戻るV2</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16}#community-v1{display:block;border:0;width:100%;height:100%}</style></head><body>
<iframe id="community-v1" title="COMMUNITY ここに戻るV2 投稿画面" src="./COMMUNITY_ここに戻るV1_20261112.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('community-v1');
var densuke='./伝助のインジケータ_ここに戻る_V1.html';
function setup(){
 try{
  var d=frame.contentDocument;if(!d)return;
  d.querySelectorAll('.community-mobile-home a').forEach(function(a){
   a.textContent='伝助のインジケータ';
   a.setAttribute('href',densuke);
   a.setAttribute('target','_parent');
   if(a.dataset.v2Densuke==='yes')return;
   a.dataset.v2Densuke='yes';
   a.addEventListener('click',function(e){
    e.preventDefault();e.stopImmediatePropagation();
    window.location.href=densuke;
   },true);
  });
 }catch(e){console.error('COMMUNITY V2 navigation',e);}
}
frame.addEventListener('load',setup);
})();
</script></body></html>
