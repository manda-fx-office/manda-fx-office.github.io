<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COMMUNITY ここに戻るV2 — タブレット配置修正テスト</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16}#community-v1{display:block;border:0;width:100%;height:100%}</style></head><body>
<iframe id="community-v1" title="COMMUNITY ここに戻るV2 投稿画面" src="./COMMUNITY_ここに戻るV1_20261112.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('community-v1');
var densuke='./伝助のインジケータ_ここに戻る_V1.html';
function setup(){
 try{
  var d=frame.contentDocument;if(!d)return;
  var group=d.querySelector('.community-mobile-home');
  if(!group)return;
  var links=group.querySelectorAll('a');
  links.forEach(function(a){
   a.textContent='伝助のインジケータ';
   a.setAttribute('href',densuke);
   a.setAttribute('target','_parent');
   if(a.dataset.v2Densuke==='yes')return;
   a.dataset.v2Densuke='yes';
   a.addEventListener('click',function(e){
    e.preventDefault();e.stopImmediatePropagation();
    window.location.href=densuke;
   },true);
  });
  // Only style this community V2 iframe. Do not change V1, TOP, phone or PC files.
  if(!d.getElementById('community-v2-small-densuke')){
   var style=d.createElement('style');
   style.id='community-v2-small-densuke';
   style.textContent='.community-mobile-home{width:100%!important;max-width:none!important;margin:14px auto 10px!important;text-align:center!important;display:flex!important;justify-content:center!important;align-items:center!important;padding:0 12px!important;box-sizing:border-box!important}.community-mobile-home a{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:auto!important;min-width:0!important;max-width:240px!important;padding:9px 18px!important;font-size:14px!important;line-height:1.4!important;min-height:38px!important;box-sizing:border-box!important}';
   d.head.appendChild(style);
  }
  // Identify the QR code in the BOTTOM content area, never the header/taskbar.
  // The previous first-match selector could mistakenly select a header element.
  var candidates=Array.from(d.querySelectorAll('[class*="qr" i], [id*="qr" i], img,canvas,svg, h2,h3,h4,p,span'));
  var bottomQR=candidates.filter(function(el){
   if(group.contains(el)||el.closest('header,nav,.topbar,.taskbar,[class*="taskbar" i],[class*="topbar" i]'))return false;
   var desc=((el.getAttribute('src')||'')+' '+(el.getAttribute('alt')||'')+' '+(el.getAttribute('class')||'')+' '+(el.getAttribute('id')||''));
   var label=(el.children.length===0 ? el.textContent||'' : '');
   if(!(/qr(?:code|[-_ ]?code)?/i.test(desc)||/QRコード|QR code/i.test(label)))return false;
   var rect=el.getBoundingClientRect();
   return rect.width>0 && rect.height>0 && rect.top>Math.max(180,d.documentElement.clientHeight*.35);
  }).sort(function(a,b){return b.getBoundingClientRect().top-a.getBoundingClientRect().top;})[0];
  if(bottomQR){
   // Prefer a small enclosing QR section, but never move into a header.
   var qrSection=bottomQR.closest('section,figure,[class*="qr-section" i],[class*="qr-wrap" i]')||bottomQR.parentElement;
   var target=(qrSection && qrSection!==group && !qrSection.contains(group) && qrSection.getBoundingClientRect().top>180)?qrSection:bottomQR;
   if(target.parentNode && !target.contains(group)){
    target.parentNode.insertBefore(group,target);
   }
  }
  // If no bottom QR can be confidently identified, leave the button where it
  // originally was rather than incorrectly inserting it into the taskbar.
 }catch(e){console.error('COMMUNITY V2 button placement',e);}
}
frame.addEventListener('load',setup);
})();
</script></body></html>
