<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COMMUNITY ここに戻るV2 — タブレット配置修正テスト</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16}#community-v1{display:block;border:0;width:100%;height:100%}</style></head><body>
<iframe id="community-v1" title="COMMUNITY ここに戻るV2 投稿画面" src="./COMMUNITY_ここに戻るV1_20261112.html"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('community-v1');
var densuke='./伝助のインジケータ_ここに戻る_V1.html';
function setup(){
 try{
  var d=frame.contentDocument;if(!d)return;
  var group=d.querySelector('.community-mobile-home');
  if(!group)return;
  var links=group.querySelectorAll('a');
  links.forEach(function(a){
   a.textContent='伝助のインジケータ';
   a.setAttribute('href',densuke);
   a.setAttribute('target','_parent');
   if(a.dataset.v2Densuke==='yes')return;
   a.dataset.v2Densuke='yes';
   a.addEventListener('click',function(e){
    e.preventDefault();e.stopImmediatePropagation();
    window.location.href=densuke;
   },true);
  });
  // Only style this community V2 iframe. Do not change V1, TOP, phone or PC files.
  if(!d.getElementById('community-v2-small-densuke')){
   var style=d.createElement('style');
   style.id='community-v2-small-densuke';
   style.textContent='.community-mobile-home{width:100%!important;max-width:none!important;margin:14px auto 10px!important;text-align:center!important;display:flex!important;justify-content:center!important;align-items:center!important;padding:0 12px!important;box-sizing:border-box!important}.community-mobile-home a{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:auto!important;min-width:0!important;max-width:280px!important;padding:12px 24px!important;font-size:16px!important;line-height:1.4!important;min-height:46px!important;box-sizing:border-box!important}';
   d.head.appendChild(style);
  }
  // Place the small navigation button BEFORE the entire QR card, never inside it.
  // Match the card by its visible heading, not by ambiguous QR classes in the header.
  var heading=Array.from(d.querySelectorAll('h1,h2,h3,h4,p,div,span')).find(function(el){
    return el.children.length===0 && /時間を共有しませんか/.test(el.textContent||'');
  });
  var qrCard=null;
  if(heading){
    var node=heading;
    while(node && node!==d.body){
      var rect=node.getBoundingClientRect();
      if(rect.width>=d.documentElement.clientWidth*.65 && rect.height>=240 && rect.top>120){
        qrCard=node;break;
      }
      node=node.parentElement;
    }
  }
  if(qrCard && qrCard.parentNode && !qrCard.contains(group)){
    // Remove any fixed positioning inherited from the original footer.
    group.style.setProperty('position','relative','important');
    group.style.setProperty('top','auto','important');
    group.style.setProperty('bottom','auto','important');
    group.style.setProperty('left','auto','important');
    group.style.setProperty('right','auto','important');
    group.style.setProperty('transform','none','important');
    group.style.setProperty('visibility','visible','important');
    group.style.setProperty('opacity','1','important');
    group.style.setProperty('z-index','2','important');
    qrCard.parentNode.insertBefore(group,qrCard);
  } else {
    // Safe fallback: do not hide or detach the existing button.
    group.style.setProperty('visibility','visible','important');
    group.style.setProperty('display','flex','important');
  }
 }catch(e){console.error('COMMUNITY V2 button placement',e);}
}
frame.addEventListener('load',setup);
})();
</script></body></html>
