function repair(){
 try{
  var d=frame.contentDocument;if(!d)return;
  bindDocument(d);
  if(decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop())==='android_tablet_saved_top_20261105_ここに戻るV2.html')transplantSavedPostWindow(d);
  if(decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop())==='伝助のインジケータ_ここに戻る_V1.html')transplantCommunityWindowToDensuke(d);
  if(decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop())==='android_tablet_tradesystem_5cards_return_fx_test_20261110.html')transplantDensukeWindowToSystem(d);
  if(decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop())==='board.html')transplantSystemWindowToBoard(d);
  var page=decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
  // Mount the completed FX entrance page behind the approved TOP's first entry.
  // This changes only the test controller's live DOM; no saved HTML file is edited.
  if(page==='android_tablet_saved_top_20261105_ここに戻るV2.html'){
   var entrance=d.querySelector('.entry-buttons a.entry-btn[href="android_tablet_home.html"]');
   if(entrance){
    entrance.setAttribute('href',pages.home);
    var title=entrance.querySelector('b');
    if(title)title.textContent='FXの入口';
   }
  }
  // Keep the saved Densuke logo artwork, but route its click directly to the approved TOP.
  if(page==='伝助のインジケータ_ここに戻る_V1.html'){
   d.querySelectorAll('header.topbar a.brand-logo').forEach(function(a){
    a.setAttribute('href',pages.top);
    a.removeAttribute('target');
    if(!a.__approvedTopRoute){
     a.__approvedTopRoute=true;
     a.addEventListener('click',function(e){
      e.preventDefault();e.stopImmediatePropagation();go('top','');
     },true);
    }
   });
  }
  // Restore the approved tablet footer labels without altering the saved V1 file.
  if(page==='伝助のインジケータ_ここに戻る_V1.html'){
   d.querySelectorAll('a').forEach(function(a){
    var t=(a.textContent||'').replace(/\s+/g,' ').trim();
    if(/ページTOPに戻る|ページトップに戻る/.test(t)){
     a.textContent='⌂ ページトップに戻る';
    }else if(/HOMEに戻る|FXの入口/.test(t)){
     a.textContent='⌂ FXの入口';
     a.setAttribute('href',pages.home);
    }
   });
  }
  // Broker page only: replace the bottom FX entrance button with the saved Densuke page.
  if(page==='fx_companies.html'){
   d.querySelectorAll('.actions a').forEach(function(a){
    if(/FXの入口/.test((a.textContent||'').trim())){
     a.textContent='伝助のインジケータ';
     a.setAttribute('href',pages.project);
     a.removeAttribute('target');
    }
   });
  }
  // Replace legacy internal destinations in the live tablet page before any click.
  // Keep the saved source files unchanged and preserve in-page anchors.
  d.querySelectorAll('a[href]').forEach(function(a){
   var raw=a.getAttribute('href')||'';
   if(!raw||raw.charAt(0)==='#')return;
   var mapped=fromHref(raw);
   if(mapped && pages[mapped.type]){
    a.setAttribute('href',pages[mapped.type]+(mapped.hash||''));
    a.removeAttribute('target');
   }
  });
  // All FX entrance return links must lead to the same tablet HOME, never
  // to the legacy homepage or an intermediate navigation test file.
  d.querySelectorAll('a').forEach(function(a){
   var label=(a.textContent||'').replace(/\\s+/g,' ').trim();
   if(/FXの入口/.test(label) && !/ページトップ/.test(label)){
    a.setAttribute('href',pages.home);a.removeAttribute('target');
   }
  });
  // Explicitly pin the TOP's FX entrance by its visible label, even if its
  // original href is an obsolete or unlisted HOME filename.
  if(page==='android_tablet_saved_top_20261105_ここに戻るV2.html'){
   d.querySelectorAll('a').forEach(function(a){
    var label=(a.textContent||'').replace(/\\s+/g,' ').trim();
    if(/FXの入口|HOMEページ/.test(label) && !/ページトップに戻る/.test(label)){
     a.setAttribute('href',pages.home);a.removeAttribute('target');
    }
   });
  }
  // Normalize legacy return buttons across every tablet page, not just Densuke.
  d.querySelectorAll('a').forEach(function(a){
   var label=(a.textContent||'').replace(/\\s+/g,' ').trim();
   if(/^(?:[⌂←\\s]*)?(?:HOMEに戻る|HOMEへ戻る|HOMEページに戻る|FXの入口(?:へ|に)?戻る)$/.test(label)){
    a.textContent='FXの入口';
    a.setAttribute('href',pages.home);
    a.removeAttribute('target');
   }
  });
  d.querySelectorAll('a[target="_top"],a[target="_parent"],a[target="_blank"]').forEach(function(a){
   if(fromHref(a.getAttribute('href'))||fromLabel(a)||isLogo(a))a.removeAttribute('target');
  });
 }catch(e){console.error('tablet approved routes',e)}finally{frame.style.visibility='visible';}
}
frame.addEventListener('load',repair);
// Direct navigation into the same controller used by the TOP FX entrance.
try{var requested=new URLSearchParams(location.search).get('page');if(requested&&pages[requested])go(requested,'');}catch(e){}
})();
