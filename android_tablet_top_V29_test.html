<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM - Android Tablet V29 Layout Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#000}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM Android Tablet V29" allow="autoplay; fullscreen"></iframe>
<script>
(function(){
  var frame=document.getElementById("tabletTop");
  function applyTabletLayout(){
    try{
      var doc=frame.contentDocument||frame.contentWindow.document;
      if(!doc||!doc.head||!doc.body)return;
      var prior=doc.getElementById("tablet-v29-layout-test");
      if(prior)prior.remove();
      var style=doc.createElement("style");
      style.id="tablet-v29-layout-test";
      style.textContent=[
        "/* Tablet test: expose the same four controls used by the smartphone V29 layout. */",
        "html,body{margin:0!important;width:100%!important;min-height:100%!important;background:#000!important;}",
        ".entry-buttons{display:none!important;}",
        ".smartphone-top-controls{display:grid!important;position:absolute!important;left:50%!important;top:auto!important;bottom:7%!important;transform:translateX(-50%)!important;width:calc(100% - 48px)!important;max-width:760px!important;margin:0!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;z-index:20!important;}",
        ".smartphone-top-controls .entry-btn{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;min-width:0!important;width:auto!important;min-height:66px!important;padding:12px 8px!important;box-sizing:border-box!important;}",
        ".smartphone-top-controls .entry-btn b{font-size:clamp(16px,2.2vw,22px)!important;letter-spacing:1px!important;line-height:1.2!important;}",
        ".smartphone-top-controls .entry-btn span{font-size:12px!important;line-height:1.25!important;margin-top:4px!important;}",
        ".smartphone-top-controls .entry-btn:nth-child(2) b{font-size:clamp(13px,1.8vw,18px)!important;letter-spacing:0!important;}",
        ".community-preview,.community-more,.site-purpose,.qr-access{display:none!important;}",
        ".entrance{position:relative!important;min-height:100vh!important;height:100vh!important;height:100dvh!important;overflow:hidden!important;}",
        ".entrance img.hero-logo{position:absolute!important;top:10%!important;left:50%!important;transform:translateX(-50%)!important;width:min(58vw,440px)!important;height:auto!important;z-index:3!important;}",
        ".entrance:after{pointer-events:none!important;}",
        ".bgm-btn{z-index:30!important;}"
      ].join("\n");
      doc.head.appendChild(style);
    }catch(e){}
  }
  frame.addEventListener("load",applyTabletLayout);
  frame.src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_v29_layout_test_20261029e";
})();
</script>
</body>
</html>
