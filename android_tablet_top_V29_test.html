<title>TRANSITION SYSTEM - Android Tablet TOP V29 Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#tabletTop{display:block;width:100%;height:100dvh;min-height:100%;border:0;background:#000;visibility:hidden;overflow:hidden}
#tabletTop.ready{visibility:visible}
</style>

<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM Android Tablet TOP"
 src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_v29_test_20261029b"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyTabletSettings() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head || !doc.body) return;
      var old = doc.getElementById("android-tablet-v29-test-layout");
      if (old) old.remove();
      var style = doc.createElement("style");
      style.id = "android-tablet-v29-test-layout";
      style.textContent = [
        "/* Tablet-only test layout: smartphone V29, iPhone and PC originals stay untouched */",
        "html,body{margin:0!important;width:100%!important;height:100%!important;min-height:0!important;overflow:hidden!important;background:#000!important;}",
        "body{position:relative!important;}",
        ".site-header{position:absolute!important;top:0!important;left:0!important;width:100%!important;height:58px!important;padding:0 18px!important;}",
        ".site-header-logo{width:165px!important;max-width:45vw!important;}",
        ".entrance{position:absolute!important;top:58px!important;left:0!important;width:100%!important;height:calc(100% - 58px)!important;min-height:0!important;overflow:hidden!important;}",
        ".entrance img.hero-logo{position:absolute!important;top:7%!important;left:50%!important;transform:translateX(-50%)!important;width:min(52vw,390px)!important;max-width:390px!important;height:auto!important;}",
        ".entrance:after{pointer-events:none!important;}",
        ".entry-buttons,.site-purpose,.community-preview,.community-more{display:none!important;}",
        ".smartphone-top-controls{position:absolute!important;left:50%!important;bottom:96px!important;transform:translateX(-50%)!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:calc(100% - 40px)!important;max-width:760px!important;margin:0!important;z-index:20!important;}",
        ".smartphone-top-controls .entry-btn{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;min-width:0!important;width:auto!important;min-height:58px!important;padding:10px 6px!important;box-sizing:border-box!important;}",
        ".smartphone-top-controls .entry-btn b{font-size:clamp(14px,2.2vw,20px)!important;letter-spacing:.5px!important;line-height:1.2!important;}",
        ".smartphone-top-controls .entry-btn span{font-size:11px!important;line-height:1.2!important;margin-top:4px!important;}",
        ".smartphone-top-controls .entry-btn:nth-child(2) b{font-size:clamp(12px,1.9vw,17px)!important;letter-spacing:0!important;}",
        ".qr-access{display:none!important;}",
        ".presentation-ticker{position:absolute!important;left:50%!important;bottom:16px!important;transform:translateX(-50%)!important;width:calc(100% - 40px)!important;max-width:760px!important;margin:0!important;z-index:15!important;}",
        ".bgm-btn{position:absolute!important;top:8px!important;right:12px!important;left:auto!important;z-index:30!important;}",
        "audio{display:none!important;}"
      ].join("\n");
      doc.head.appendChild(style);
      doc.documentElement.style.height = "100%";
      doc.body.style.height = "100%";
      frame.classList.add("ready");
    } catch (e) {
      /* Retry on iframe load if the document is not ready yet. */
    }
  }
  frame.addEventListener("load", applyTabletSettings);
})();
</script>
</body>
