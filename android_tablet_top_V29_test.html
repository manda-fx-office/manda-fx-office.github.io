<title>TRANSITION SYSTEM - Android Tablet TOP V29 Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:auto;background:#000}
#tabletTop{display:block;width:100%;min-height:100%;height:100vh;border:0;background:#000;visibility:hidden}
#tabletTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM Android Tablet TOP"
 src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_v29_test_20261029"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyTabletSettings() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head || !doc.body) return;
      var old = doc.getElementById("android-tablet-v29-test-layout");
      if (old) old.remove();
      var style = doc.createElement("style");
      style.id = "android-tablet-v29-test-layout";
      style.textContent = [
        "/* Tablet test only: do not change V29 source, phone, iPhone, or PC files */",
        "html,body{width:100%;min-height:100%;}",
        ".smartphone-top-controls{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;width:calc(100% - 40px)!important;max-width:900px!important;margin:24px auto!important;}",
        ".smartphone-top-controls .entry-btn{display:block!important;width:auto!important;min-width:0!important;box-sizing:border-box!important;padding:16px 10px!important;}",
        ".smartphone-top-controls .entry-btn b{font-size:18px!important;letter-spacing:1px!important;}",
        ".smartphone-top-controls .entry-btn span{font-size:12px!important;}",
        ".smartphone-top-controls .entry-btn:nth-child(2) b{font-size:16px!important;letter-spacing:.3px!important;}",
        ".entry-buttons{display:none!important;}",
        ".entrance img.hero-logo{max-width:460px!important;}",
        ".qr-access.qr-desktop{display:block!important;margin:24px auto!important;max-width:900px!important;}",
        ".qr-access.qr-desktop .qr-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;max-width:360px!important;margin:0 auto!important;}",
        ".qr-access.qr-desktop .qr-card{max-width:170px!important;width:100%!important;}",
        ".qr-access.qr-desktop .qr-card img{width:100%!important;height:auto!important;}"
      ].join("\n");
      doc.head.appendChild(style);
      frame.style.height = Math.max(doc.documentElement.scrollHeight || 0, doc.body.scrollHeight || 0, window.innerHeight) + "px";
      frame.classList.add("ready");
    } catch (e) {
      /* If page is still loading, the load event will retry. */
    }
  }
  frame.addEventListener("load", applyTabletSettings);
})();
</script>
</body>
</html>
