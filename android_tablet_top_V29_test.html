<title>TRANSITION SYSTEM - Android Tablet TOP V29 Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:auto;background:#000}
#tabletTop{display:block;width:100%;min-height:100%;height:100vh;border:0;background:#000;visibility:hidden}
#tabletTop.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="tabletTop" title="TRANSITION SYSTEM Android Tablet TOP"></iframe>
<script>
(function () {
  var frame = document.getElementById("tabletTop");
  function applyTabletSettings() {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc || !doc.head || !doc.body) return;
      var old = doc.getElementById("android-tablet-bgm-position-test");
      if (old) old.remove();
      var style = doc.createElement("style");
      style.id = "android-tablet-bgm-position-test";
      style.textContent = [
        "/* Diagnostic only: test the BGM selector and placement. No other layout changes. */",
        ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}"
      ].join("\n");
      doc.head.appendChild(style);
      frame.classList.add("ready");
    } catch (e) {
      /* Keep the test page visible only after same-origin styling succeeds. */
    }
  }
  frame.addEventListener("load", applyTabletSettings);
  frame.src = "index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_bgm_test_20261029c";
})();
</script>
</body>
