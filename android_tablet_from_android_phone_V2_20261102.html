<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM Android Tablet - Phone V29 Adaptation V2</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#000;overflow-x:hidden;overflow-y:auto}
#phoneBase{display:block;width:100%;height:100vh;min-height:100vh;border:0;background:#000;visibility:hidden}
#savedAt{position:fixed;z-index:99999;top:5px;right:10px;padding:3px 7px;border:1px solid rgba(180,210,230,.45);border-radius:5px;background:rgba(0,0,0,.72);color:#c9d9e5;font:10px/1.3 Arial,sans-serif;pointer-events:none}
</style>
</head>
<body>
<div id="savedAt">タブレット変換版 V2 / 2026-11-02 20:30 JST</div>
<iframe id="phoneBase" title="Androidスマホ正式保存版V29を原本にしたタブレット表示"
 src="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29_%E4%BF%AE%E6%AD%A3%E7%89%88_%E3%83%AD%E3%82%B4%E4%BF%AE%E6%AD%A3.html?v=tablet_phone_base_20261102_v2b"></iframe>
<script>
(function(){
 var frame=document.getElementById("phoneBase");
 var busy=false;
 function resizeFrame(){
  try{
   var doc=frame.contentDocument||frame.contentWindow.document;
   if(!doc||!doc.documentElement||!doc.body)return;
   doc.documentElement.style.setProperty("height","auto","important");
   doc.documentElement.style.setProperty("min-height","0","important");
   doc.documentElement.style.setProperty("overflow-y","visible","important");
   doc.body.style.setProperty("height","auto","important");
   doc.body.style.setProperty("min-height","0","important");
   doc.body.style.setProperty("overflow-y","visible","important");
   var h=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
   if(h>0){frame.style.height=(Math.ceil(h)+4)+"px";frame.style.visibility="visible";}
  }catch(e){frame.style.visibility="visible";frame.style.height="100vh";}
 }
 function apply(){
  if(busy)return;
  busy=true;
  try{
   var doc=frame.contentDocument||frame.contentWindow.document;
   if(!doc||!doc.head||!doc.body)throw new Error("V29 document unavailable");
   var old=doc.getElementById("android-tablet-phone-adaptation-v2");
   if(old)old.remove();
   var style=doc.createElement("style");
   style.id="android-tablet-phone-adaptation-v2";
   style.textContent=[
    "/* Tablet-only presentation layer. The V29 smartphone source file remains unchanged. */",
    "html,body{height:auto!important;min-height:0!important;overflow-x:hidden!important;overflow-y:visible!important;}",
    ".bgm-btn{left:24px!important;right:auto!important;top:10px!important;padding:8px 12px!important;font-size:11px!important;}",
    ".entrance .entry-buttons{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;bottom:18%!important;}",
    ".entrance .entry-buttons .entry-btn{display:block!important;min-width:0!important;width:auto!important;padding:12px 7px!important;box-sizing:border-box!important;}",
    ".entrance .entry-buttons .entry-btn b{font-size:17px!important;letter-spacing:1px!important;}",
    ".entrance .entry-buttons .entry-btn span{font-size:10px!important;}",
    ".entrance .presentation-ticker{width:calc(100% - 36px)!important;max-width:850px!important;left:50%!important;transform:translateX(-50%)!important;}",
    ".entrance{overflow:visible!important;}",
    ".community-preview,.site-purpose{height:auto!important;overflow:visible!important;}"
   ].join(String.fromCharCode(10));
   doc.head.appendChild(style);
   var buttons=doc.querySelectorAll(".entrance .entry-buttons a.entry-btn");
   if(buttons.length>=2){
    buttons[1].href="project.html";
    buttons[1].target="_top";
    buttons[1].innerHTML="<b>伝助のインジケーター</b><span>伝助のインジケーター</span>";
    buttons[1].setAttribute("aria-label","伝助のインジケーター");
   }
   // Keep every existing V29 section (including QR and community preview) scrollable.
   var images=Array.prototype.slice.call(doc.images||[]);
   images.forEach(function(img){if(!img.complete)img.addEventListener("load",resizeFrame,{once:true});});
   resizeFrame();
   setTimeout(resizeFrame,250);
   setTimeout(resizeFrame,900);
   setTimeout(resizeFrame,1800);
   if(doc.fonts&&doc.fonts.ready)doc.fonts.ready.then(resizeFrame).catch(function(){});
  }catch(e){
   frame.style.visibility="visible";
   frame.style.height="100vh";
  }finally{busy=false;}
 }
 frame.addEventListener("load",apply);
})();
</script>
</body>
</html>
