<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLUS ONE | TRANSITION SYSTEM</title><style>body{margin:0;background:linear-gradient(140deg,#111720,#303743);color:#f4f4f4;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:stretch}.wrap{margin:auto;text-align:center;padding:32px;border:1px solid #75869a;border-radius:16px;max-width:500px;width:80%}h1{font-size:clamp(30px,6vw,52px);letter-spacing:.12em}p{font-size:24px}button{margin-top:24px;padding:14px 28px;background:#39495c;color:#fff;border:1px solid #a9bacb;border-radius:9px;font-size:16px;cursor:pointer}</style><script src='/PC_TOP_共通設定V12_PLUS_ONE表示統一.js'></script><style id="pc-plus-one-taskbar-style">
.topbar{position:sticky;top:0;z-index:20;background:rgba(4,4,4,.95);backdrop-filter:blur(10px);border-bottom:1px solid #292d31}
.nav{max-width:1220px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:18px}
.brand-logo{display:block;flex:0 0 auto}.brand-logo img{width:150px;height:auto;display:block}
.navlinks{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.navlinks a{min-width:92px;height:54px;padding:6px 8px;border:1px solid rgba(210,215,220,.58);border-radius:8px;background:linear-gradient(180deg,#484f56,#30363c 55%,#20252a);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 5px #0007;text-decoration:none}
.navlinks a:hover{border-color:#e0e4e7;background:linear-gradient(180deg,#5a636c,#3a4249 55%,#292f35)}
.nav-en{font-size:11px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.nav-ja{margin-top:4px;font-size:9px;letter-spacing:.5px;line-height:1.1}
@media(max-width:900px){.nav{padding:10px 12px}.brand-logo img{width:135px}.navlinks{display:none}}

/* PLUS ONE: BOARD taskbar visible on narrow screens too */
@media(max-width:900px){.topbar .nav{flex-wrap:wrap;justify-content:center}.topbar .navlinks{display:flex;gap:4px}.topbar .navlinks a{min-width:75px;height:48px;padding:4px 6px}.topbar .nav-en{font-size:10px}.topbar .nav-ja{font-size:8px}}
</style></head><body><header class="topbar"><nav class="nav"><a class="brand-logo" href="PC_TOP_PLUS_ONE表示統一テストV25.html" aria-label="TOPへ戻る"><img src="/logo.png" alt="TRANSITION SYSTEM"></a><div class="navlinks"></div></nav></header><main class="wrap"><h1>PLUS ONE</h1><p>ただいま工事中です</p><button onclick="if(parent&&parent!==window&&parent.__iphoneReturnToLoadedTop){parent.__iphoneReturnToLoadedTop()}else{location.href='11_19PC_TOP_ここに戻る基準保存版V5.html'}">TOPページに戻る</button></main><script id="pc-plus-one-taskbar-v1">
(function(){
'use strict';var cfg=window.TRANSITION_PC_NAV_V12;if(!cfg)return;
var nav=document.querySelector('.topbar .navlinks'),logo=document.querySelector('.topbar .brand-logo');if(!nav||!logo)return;
var buttons=[['system','SYSTEM','システム'],['project','伝助のインジケーター','伝助のインジケーター'],['community','COMMUNITY','コミュニティー'],['board','BOARD','伝言板'],['plusOne','PLUS ONE','プラスワン'],['qa','管理人 Q&A','管理人 Q&A'],['login','LOGIN','ログイン']];
buttons.forEach(function(item){var a=document.createElement('a');a.href=cfg.routes[item[0]];var en=document.createElement('span');en.className='nav-en';en.textContent=item[1];var ja=document.createElement('span');ja.className='nav-ja';ja.textContent=item[2];a.append(en,ja);nav.appendChild(a)});
logo.href=cfg.routes.top;
function goTop(e){e.preventDefault();e.stopImmediatePropagation();if(window.parent!==window)window.parent.postMessage(cfg.returnMessage,location.origin);else window.location.assign(cfg.routes.top)}
logo.addEventListener('click',goTop,true);
var back=document.querySelector('main.wrap button');if(back){back.removeAttribute('onclick');back.addEventListener('click',goTop,true)}
})();
</script></body></html>
