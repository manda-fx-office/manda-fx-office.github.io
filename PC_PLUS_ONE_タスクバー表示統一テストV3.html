<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLUS ONE | TRANSITION SYSTEM</title><style>body{margin:0;background:linear-gradient(140deg,#111720,#303743);color:#f4f4f4;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:stretch}.wrap{margin:auto;text-align:center;padding:32px;border:1px solid #75869a;border-radius:16px;max-width:500px;width:80%}h1{font-size:clamp(30px,6vw,52px);letter-spacing:.12em}p{font-size:24px}button{margin-top:24px;padding:14px 28px;background:#39495c;color:#fff;border:1px solid #a9bacb;border-radius:9px;font-size:16px;cursor:pointer}</style><script src='/PC_TOP_共通設定V12_PLUS_ONE表示統一.js'></script><style id="pc-plus-one-taskbar-style">.topbar{position:sticky;top:0;z-index:20;background:rgba(4,4,4,.94);backdrop-filter:blur(10px);border-bottom:1px solid #292d31}.nav{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 22px}.brand-logo{display:block}.brand-logo img{width:150px;height:auto;display:block}.navlinks{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.navlinks a{min-width:104px;height:58px;padding:7px 10px;border:1px solid rgba(210,215,220,.65);border-radius:8px;background:linear-gradient(180deg,#4a5158,#30363c 55%,#20252a);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 5px #0006}.nav-en{font-size:13px;font-weight:700;letter-spacing:.5px}.nav-ja{margin-top:4px;font-size:10px;letter-spacing:1px}.navlinks a:hover{border-color:#e0e4e7;background:linear-gradient(180deg,#5b646d,#3b434b 55%,#292f35)}
