<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRANSITION SYSTEM - 承認TOP V1 統合保存版</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}iframe{display:block;width:100%;height:100%;border:0;visibility:hidden}</style></head><body>
<iframe id="tablet-page" title="TRANSITION SYSTEM" src="/android_tablet_top_v1_bgm_single_test.html?tablet=approved-top-v1" allow="autoplay"></iframe>
<script>
(function(){
'use strict';
var frame=document.getElementById('tablet-page');
var pages={
 top:'/android_tablet_top_v1_bgm_single_test.html',
 home:'/android_tablet_HOME_direct_2col_test_20261111.html',
 project:'/android_tablet_project_FX入口導線修正版_20261113.html',
 community:'/COMMUNITY_ここに戻るV2_20261112.html',
 system:'/android_tablet_tradesystem_5cards_return_fx_test_20261110.html',
 board:'/board.html',login:'/login.html',qa:'/admin_qa.html',broker:'/fx_companies.html'
};
var routes={
 'index.html':'top','android_start_v2.html':'top','android_tablet_top_保存版_20261103.html':'top',
 'home.html':'home','android_tablet_home.html':'home','android_tablet_HOME_test_20261106.html':'home',
 'android_tablet_HOME_direct_2col_test_20261111.html':'home',
 'project.html':'project','android_tablet_project_saved.html':'project','fx.html':'home','android_tablet_home_v6_preview_direct_V2_20261105.html':'home',
 'community.html':'community','product_tradesystem.html':'system','board.html':'board',
 'login.html':'login','admin_qa.html':'qa','fx_companies.html':'broker'
};
function fromHref(href){
 if(!href||href.charAt(0)==='#'||/^(javascript:|mailto:|tel:)/i.test(href))return null;
 try{
  var u=new URL(href,frame.contentWindow.location.href);
  if(u.origin!==location.origin && u.hostname!=='manda-fx-office.github.io')return null;
  var name=decodeURIComponent(u.pathname.split('/').pop());
  var type=routes[name]||null;
  if(!type)return null;
  return {type:type,hash:u.hash};
 }catch(e){return null;}
}
function fromLabel(el){
 var t=((el.innerText||el.textContent||'')+' '+(el.getAttribute('aria-label')||'')).replace(/\s+/g,' ').trim();
 if(/コミュニティ|コミニティ/i.test(t))return 'community';
 if(/伝助のインジケータ/i.test(t))return 'project';
 if(/FXの入口|HOMEページに戻る|\bHOME\b|ホームページに戻る/i.test(t))return 'home';
 if(/ページトップに戻る|前へ|次へ|コピー|再生|停止/i.test(t))return null;
 if(/管理人Q\s*&\s*A/i.test(t))return 'qa';
 if(/証券会社|FX会社紹介/i.test(t))return 'broker';
 if(/\bBOARD\b/i.test(t))return 'board';
 if(/\bLOGIN\b|ログイン/i.test(t))return 'login';
 if(/\bSYSTEM\b|TRADE SYSTEM/i.test(t))return 'system';
 return null;
}
function go(type,hash){
 var target=pages[type];if(!target)return;
 if(hash)target+=hash;
 frame.style.visibility='hidden';
 frame.src=target;
 try{history.replaceState(null,'',location.pathname+'?page='+encodeURIComponent(type))}catch(e){}
}
function isLogo(el){
 var a=el.closest&&el.closest('a,button,[role="button"]');
 if(!a)return false;
 var bar=a.closest('.topbar,.taskbar,.mobile-taskbar,header,nav,[class*="taskbar"],[class*="topbar"]');
 var logo=a.matches('.brand-logo,[class*="logo"]')||!!a.querySelector('img.logo,.brand-logo,img[class*="logo"],svg[class*="logo"]');
 var title=(a.getAttribute('aria-label')||'')+' '+(a.getAttribute('title')||'');
 return !!bar&&(logo||(/TOPページ|トップページ/.test(title)&&!!a.querySelector('img,svg')));
}
function bindDocument(d){
 if(!d||d.__tabletApprovedRoutes)return;
 d.__tabletApprovedRoutes=true;
 d.addEventListener('click',function(e){
  var el=e.target&&e.target.closest&&e.target.closest('a,button,[role="button"]');
  if(!el)return;
  var href=el.getAttribute('href')||'';
  if(href.charAt(0)==='#')return;
  var dest=null;
  if(isLogo(el))dest={type:'top',hash:''};
  else{
   var label=fromLabel(el);
   if(label)dest={type:label,hash:''};
   else dest=fromHref(href);
  }
  if(!dest)return;
  e.preventDefault();e.stopImmediatePropagation();
  go(dest.type,dest.hash);
 },true);
 function bindChildren(){
  d.querySelectorAll('iframe').forEach(function(f){
   try{bindDocument(f.contentDocument)}catch(e){}
   if(!f.__tabletApprovedLoad){f.__tabletApprovedLoad=true;f.addEventListener('load',function(){try{bindDocument(f.contentDocument)}catch(e){}})}
  });
 }
 bindChildren();
 try{new MutationObserver(bindChildren).observe(d.documentElement,{childList:true,subtree:true})}catch(e){}
}
function repair(){
 try{
  var d=frame.contentDocument;if(!d)return;
  bindDocument(d);
  var page=decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
  if(page==='android_tablet_top_v1_bgm_single_test.html'){
   d.querySelectorAll('a,button,[role="button"]').forEach(function(el){
    var t=(el.innerText||el.textContent||'').trim();
    if(/^HOME(?:\\s|$)/i.test(t)){
     var w=d.createTreeWalker(el,NodeFilter.SHOW_TEXT),n;
     while((n=w.nextNode())){if(/HOME/.test(n.nodeValue)){n.nodeValue=n.nodeValue.replace(/HOME/g,'FXの入口');break;}}
    }
   });
  }
  d.querySelectorAll('a[target="_top"],a[target="_parent"],a[target="_blank"]').forEach(function(a){
   if(fromHref(a.getAttribute('href'))||fromLabel(a)||isLogo(a))a.removeAttribute('target');
  });
 }catch(e){console.error('tablet approved routes',e)}finally{frame.style.visibility='visible';}
}
frame.addEventListener('load',repair);
// Direct navigation into the same controller used by the TOP FX entrance.
try{var requested=new URLSearchParams(location.search).get('page');if(requested&&pages[requested])go(requested,'');}catch(e){}
})();
</script></body></html>
