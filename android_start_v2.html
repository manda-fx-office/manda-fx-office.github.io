<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  var isTablet = isAndroid && (!isMobileUA || smallSide >= 600);

  // タブレットは中継ページを挟まず、今回の専用TOPファイルへ直接接続。
  // Androidスマホ・iPhone・PCは index.html の従来導線を維持。
  var target = isTablet
    ? "android_tablet_top_%E4%BF%9D%E5%AD%98%E7%89%88_20261102_1911.html?baseline=20261102_1911"
    : "index.html";
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
<p><a href="android_tablet_top_%E4%BF%9D%E5%AD%98%E7%89%88_20261102_1911.html">Androidタブレット用TOPを開く</a></p>
</body>
</html>
