<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  // 端末を分離：Androidタブレットだけ保存済みタブレットTOPへ。
  // Androidスマホはスマホ保存版へ。iPhone/PCの既存経路は維持。
  var isTablet = isAndroid && (!isMobileUA || /Tablet/i.test(ua) || smallSide >= 600);
  var tabletTarget = "android_tablet_top_%E6%AD%A3%E5%B8%B8%E8%B5%B7%E5%8B%95%E4%BF%9D%E5%AD%98%E7%89%88_20261028.html?v=20261028_saved_baseline";
  var phoneTarget = "index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E4%BF%9D%E5%AD%98%E7%89%88_8%E6%99%8235%E5%88%86%E5%9F%BA%E6%BA%96_4%E3%83%9C%E3%82%BF%E3%83%B3%E5%84%AA%E5%85%88_%E3%83%86%E3%83%AD%E3%83%83%E3%83%97%E3%81%95%E3%82%89%E3%81%AB%E4%B8%8A.html?v=20261028_android_phone_restore";
  var target = isTablet ? tabletTarget : (isAndroid ? phoneTarget : "index.html");
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>

</body>
</html>
