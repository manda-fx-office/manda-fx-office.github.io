<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  var isTablet = isAndroid && (!isMobileUA || smallSide >= 600);

  // Androidスマホは正常な保存版起動を維持する。
  // Androidタブレットも同じ index.html に統一し、旧式の個別TOPへ振り分けない。
  // 保存版HTML本体・PC版・その他の既存ページは変更しない。
  var target = "index.html";
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
<p><a href="index.html">TOPページを開く</a></p>
</body>
</html>
