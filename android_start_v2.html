<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  var isTablet = isAndroid && (!isMobileUA || smallSide >= 600);
  // タブレットだけ、スマホ実機で確認できるV29正式保存版へ直接移動する。
  // Androidスマホ・iPhone・PCの起動経路と各保存版本体は変更しない。
  var tabletTarget = "index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29.html";
  window.location.replace(isTablet ? tabletTarget : "index.html");
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
<p><a href="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29.html">スマホ正式保存版 V29 を開く</a></p>
</body>
