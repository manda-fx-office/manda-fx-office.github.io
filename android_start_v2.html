<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  // Androidタブレットは画面倍率によりCSS幅が小さく報告されることがあるため、判定しきい値を調整。
  // Androidスマホは通常smallSideが400未満、またはMobile UAで小画面のためindex.htmlへ。
  var isTablet = isAndroid && (!isMobileUA || smallSide >= 450);
  window.location.replace(isTablet ? "android_tablet_top.html" : "index.html");
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
<p><a href="android_tablet_top.html">AndroidタブレットTOPを開く</a></p>
</body>
</html>
