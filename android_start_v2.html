<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isMobileUA = /Mobile/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var smallSide = Math.min(w, h);
  var isTablet = isAndroid && (!isMobileUA || smallSide >= 600);

  // Androidタブレットはタブレット用ラッパーへ。Androidスマホは保存版V29へ直接進む。
  // 端末判定がタブレットをスマホと誤認しても、旧式 index.html には進ませない。
  // 保存版V29本体・PC版は変更しない。
  var target = isTablet ? "android_tablet_start.html" : "index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29.html";
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
<p><a href="index_TOP_%E3%82%B9%E3%83%9E%E3%83%9B%E6%AD%A3%E5%BC%8F%E4%BF%9D%E5%AD%98%E7%89%88_V29.html">保存版TOPを開く</a></p>
</body>
</html>
