<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var w = Number(screen.width) || Number(window.innerWidth) || 0;
  var h = Number(screen.height) || Number(window.innerHeight) || 0;
  var isTablet = isAndroid && Math.min(w, h) >= 600;
  // Androidスマホの起動先は index.html のまま維持する。
  // Androidタブレットも旧V29ではなく index.html へ統一する。
  // 保存版TOP本体とPC版には変更を加えない。
  var target = "index.html";
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
<p><a href="index.html">TOPページを開く</a></p>
</body>
</html>
