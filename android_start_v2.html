<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TRANSITION SYSTEM 起動</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var uaMobile = null;
  if (navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean") {
    uaMobile = navigator.userAgentData.mobile;
  }
  var sw = Number(screen.width) || 0;
  var sh = Number(screen.height) || 0;
  var iw = Number(window.innerWidth) || 0;
  var ih = Number(window.innerHeight) || 0;
  var sizes = [sw, sh, iw, ih].filter(function (n) { return n > 0; });
  var shortSide = sizes.length ? Math.min.apply(Math, sizes) : 0;
  var tabletUA = /Tablet/i.test(ua);
  // Android tablets use the V29 tablet wrapper. Android phones and other devices keep index.html.
  var isTablet = isAndroid && (
    uaMobile === false ||
    tabletUA ||
    (uaMobile === null && !/Mobile/i.test(ua) && shortSide >= 450) ||
    shortSide >= 600
  );
  var target = isTablet
    ? "android_tablet_top_%E4%BF%9D%E5%AD%98%E7%89%88_20261103.html?launch=20261103tablet_restore_v1"
    : "index.html";
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>TRANSITION SYSTEM を起動しています…</p>
</body>
</html>
